<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports &amp; Ratings — TrickySSC Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:#F1F5F9;color:#1E293B;}
  .topbar{background:#fff;border-bottom:1px solid #E8EDF3;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .brand{font-family:'Rajdhani';font-weight:700;font-size:20px;color:#FF6B00;}
  .who{margin-left:auto;font-size:12px;color:#64748B;}
  .btn{font-size:13px;font-weight:700;padding:9px 16px;border-radius:9px;border:0;cursor:pointer;}
  .btn-orange{background:#FF6B00;color:#fff;}
  .btn-ghost{background:#F1F5F9;color:#475569;border:1.5px solid #E2E8F0;}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{padding:9px 18px;border-radius:10px;border:1.5px solid #E2E8F0;background:#fff;color:#475569;font-weight:700;font-size:14px;cursor:pointer;}
  .tab.active{background:#FF6B00;color:#fff;border-color:#FF6B00;}
  .card{background:#fff;border:1px solid #EDF1F6;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 14px rgba(15,23,42,.05);}
  .card h2{font-family:'Rajdhani';font-size:18px;margin:0 0 10px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  input.filter{flex:1;min-width:200px;font-size:13px;padding:9px 12px;border-radius:9px;border:1.5px solid #E2E8F0;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #F1F5F9;vertical-align:top;}
  th{color:#64748B;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#F8FAFC;position:sticky;top:0;}
  tr:hover td{background:#FFFCF8;}
  code{background:#0B1220;color:#7DD3FC;padding:1px 6px;border-radius:5px;font-size:12px;word-break:break-all;}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:#FEE2E2;color:#B91C1C;font-weight:700;margin:1px 3px 1px 0;}
  .pill.b{background:#E0E7FF;color:#3730A3;}
  .pill.pyq{background:#DBEAFE;color:#1D4ED8;}
  .pill.mock{background:#DCFCE7;color:#15803D;}
  .pill.qn{background:#E0F2FE;color:#0369A1;}
  .pill.sol{background:#FEF3C7;color:#B45309;}
  .stars{color:#F59E0B;letter-spacing:1px;}
  .muted{color:#94A3B8;font-size:12px;}
  .big{font-family:'Rajdhani';font-weight:700;font-size:22px;}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .kpi{flex:1;min-width:120px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:12px;padding:12px 14px;text-align:center;}
  .kpi .v{font-family:'Rajdhani';font-weight:700;font-size:24px;color:#FF6B00;}
  .kpi .l{font-size:11px;color:#94A3B8;font-weight:600;text-transform:uppercase;}
  .gate{max-width:420px;margin:60px auto;text-align:center;}
  .spin{display:inline-block;width:26px;height:26px;border:3px solid #FFE3C9;border-top-color:#FF6B00;border-radius:50%;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .hidden{display:none;}
  .diffbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#F1F5F9;min-width:120px;}
  .diffbar i{display:block;height:100%;}
  .del{background:#FEF2F2;color:#DC2626;border:1.5px solid #FECACA;border-radius:8px;font-size:12px;font-weight:700;padding:6px 10px;cursor:pointer;white-space:nowrap;}
  .del:hover{background:#FEE2E2;}
  .del:disabled{opacity:.5;cursor:default;}
  .fix{background:#EEF2FF;color:#4338CA;border:1.5px solid #C7D2FE;border-radius:8px;font-size:12px;font-weight:700;padding:6px 10px;cursor:pointer;white-space:nowrap;margin-right:6px;}
  .fix:hover{background:#E0E7FF;}
  .fix:disabled{opacity:.5;cursor:default;}
  /* ── AI fix modal ── */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;}
  .modal.hidden{display:none;}
  .sheet{background:#fff;border-radius:16px;width:100%;max-width:900px;box-shadow:0 20px 60px rgba(15,23,42,.3);display:flex;flex-direction:column;max-height:calc(100vh - 48px);}
  .sheet-head{padding:14px 18px;border-bottom:1px solid #EDF1F6;display:flex;align-items:center;gap:10px;}
  .sheet-head .t{font-family:'Rajdhani';font-weight:700;font-size:19px;}
  .sheet-body{padding:16px 18px;overflow:auto;flex:1;}
  .sheet-foot{padding:12px 18px;border-top:1px solid #EDF1F6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#FAFBFD;border-radius:0 0 16px 16px;}
  .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:#94A3B8;cursor:pointer;}
  .sec{border:1px solid #EDF1F6;border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .sec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#64748B;font-family:'Inter';}
  .qtext{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  .fieldrow{border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#FCFDFF;}
  .fieldrow .fn{font-size:12px;font-weight:800;color:#0F172A;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .old{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:7px 9px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;color:#7F1D1D;margin:6px 0;}
  .new{width:100%;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:7px 9px;font-size:12.5px;color:#14532D;font-family:inherit;line-height:1.55;resize:vertical;min-height:38px;}
  .why{font-size:12px;color:#64748B;margin-top:6px;}
  .lbl{font-size:10px;font-weight:800;letter-spacing:.06em;color:#94A3B8;text-transform:uppercase;}
  .verdict{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:12px;}
  .v-fix{background:#FFF7ED;border:1px solid #FED7AA;color:#7C2D12;}
  .v-no{background:#F0FDF4;border:1px solid #BBF7D0;color:#14532D;}
  .v-un{background:#F8FAFC;border:1px solid #E2E8F0;color:#334155;}
  .docpill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#0B1220;color:#7DD3FC;font-family:ui-monospace,monospace;margin:2px 4px 2px 0;}
  .btn-green{background:#16A34A;color:#fff;}
  .btn-red{background:#fff;color:#DC2626;border:1.5px solid #FECACA;}
  .steps{display:flex;gap:6px;font-size:11px;color:#94A3B8;font-weight:700;margin-bottom:10px;}
  .steps b{color:#FF6B00;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">TrickySSC · Admin</span>
    <span class="who" id="who"></span>
    <button class="btn btn-ghost hidden" id="signOutBtn" onclick="doSignOut()">Sign out</button>
  </div>

  <div class="wrap">
    <div id="gate" class="gate">
      <div class="spin"></div>
      <div style="margin-top:14px;color:#64748B;">Checking access…</div>
    </div>

    <div id="app" class="hidden">
      <div class="tabs">
        <button class="tab active" id="tabReports" onclick="showTab('reports')">⚠ Question &amp; Solution Reports</button>
        <button class="tab" id="tabRatings" onclick="showTab('ratings')">⭐ Test Ratings</button>
      </div>

      <div id="reportsView">
        <div class="kpis" id="reportKpis"></div>
        <div class="card">
          <div class="row">
            <input class="filter" id="reportFilter" placeholder="Filter by test id, subject or reason…" oninput="renderReports()">
            <select class="filter" id="reportTargetFilter" style="flex:0 0 auto;min-width:170px;" onchange="renderReports()">
              <option value="">All reports</option>
              <option value="question">Question reports only</option>
              <option value="solution">Solution reports only</option>
            </select>
            <button class="btn btn-ghost" onclick="downloadCsv('reports')">Download CSV</button>
          </div>
          <h2>Most-flagged questions &amp; solutions</h2>
          <div id="reportAgg" class="muted">Loading…</div>
        </div>
        <div class="card">
          <h2>All reports (newest first)</h2>
          <div id="reportList" class="muted">Loading…</div>
        </div>
      </div>

      <div id="ratingsView" class="hidden">
        <div class="kpis" id="ratingKpis"></div>
        <div class="card">
          <div class="row">
            <input class="filter" id="ratingFilter" placeholder="Filter by test id…" oninput="renderRatings()">
            <button class="btn btn-ghost" onclick="downloadCsv('ratings')">Download CSV</button>
          </div>
          <h2>Ratings by test</h2>
          <div id="ratingAgg" class="muted">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <div id="fixModal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head">
        <span class="t" id="fixTitle">AI correction</span>
        <button class="x" onclick="closeFix()">×</button>
      </div>
      <div class="sheet-body" id="fixBody"></div>
      <div class="sheet-foot" id="fixFoot"></div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, initializeFirestore, collection, getDocs, doc, deleteDoc,
         getDoc, updateDoc, addDoc, query, where, limit, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ── Admins allowed to view this page (must also be allowed by Firestore rules) ──
const ADMIN_EMAILS = ["nirala01@gmail.com"];

const app = initializeApp({
  apiKey:"AIzaSyC4kjEYEZ6Zit9su9V5xpUhMd7vLhE90zA",
  authDomain:"trickyssc-17bb3.firebaseapp.com",
  projectId:"trickyssc-17bb3",
  storageBucket:"trickyssc-17bb3.firebasestorage.app",
  messagingSenderId:"450627057220",
  appId:"1:450627057220:web:366267bf437d94f20c6e11"
});
let db; try{ db = initializeFirestore(app,{experimentalAutoDetectLongPolling:true}); }catch(_){ db = getFirestore(app); }
const auth = getAuth(app);
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = ts => { try{ const d=ts?.toDate?ts.toDate():(ts?new Date(ts):null); return d?d.toLocaleString():''; }catch(_){ return ''; } };
const srcPill = r => { const s=String(r.source||'mock').toLowerCase(); return s==='pyq' ? '<span class="pill pyq">PYQ</span>' : '<span class="pill mock">Mock</span>'; };
// Reports carry target:'question' (raised on the test screen) or target:'solution'
// (raised under the solution in the review screen). Legacy docs have no target.
const tgtOf   = r => String(r.target||'question').toLowerCase()==='solution' ? 'solution' : 'question';
const tgtPill = r => tgtOf(r)==='solution' ? '<span class="pill sol">Solution</span>' : '<span class="pill qn">Question</span>';

let REPORTS = [], RATINGS = [];

onAuthStateChanged(auth, async (user) => {
  if(!user){
    $('gate').innerHTML = `<div class="big" style="margin-bottom:10px;">Admin sign-in</div>
      <button class="btn btn-orange" id="si" style="padding:11px 22px;">Sign in with Google</button>`;
    $('si').onclick = ()=>signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>alert(e.message));
    return;
  }
  $('who').textContent = user.email || user.uid;
  $('signOutBtn').classList.remove('hidden');
  if(!ADMIN_EMAILS.includes((user.email||'').toLowerCase())){
    $('gate').innerHTML = `<div class="big" style="color:#DC2626;margin-bottom:8px;">Not authorized</div>
      <div class="muted">Signed in as ${esc(user.email||user.uid)}. This account isn't an admin.</div>`;
    return;
  }
  await loadAll();
});

window.doSignOut = ()=>signOut(auth);

async function loadAll(){
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  try{
    const [rs, qs] = await Promise.all([
      getDocs(collection(db,'question_reports')),
      getDocs(collection(db,'mock_ratings'))
    ]);
    REPORTS = []; rs.forEach(d=>REPORTS.push({id:d.id, ...d.data()}));
    RATINGS = []; qs.forEach(d=>RATINGS.push({id:d.id, ...d.data()}));
    renderReports(); renderRatings();
  }catch(e){
    $('app').innerHTML = `<div class="card" style="color:#DC2626;">Couldn't read the collections: ${esc(e.message||e)}<br>
      <span class="muted">If this is a permissions error, update your Firestore rules so admins can read <code>question_reports</code> and <code>mock_ratings</code> (see the notes I shared).</span></div>`;
  }
}

function tsMs(r){ const t=r.createdAt; try{ return t?.toDate?t.toDate().getTime():(t?new Date(t).getTime():0); }catch(_){ return 0; } }

window.renderReports = function(){
  const f = ($('reportFilter').value||'').toLowerCase();
  const tf = (($('reportTargetFilter')||{}).value)||'';
  const rows = REPORTS
    .filter(r => !tf || tgtOf(r)===tf)
    .filter(r => !f || (`${r.mockId} ${r.subject} ${r.reason} ${r.note} ${r.testName} ${r.source||'mock'} ${tgtOf(r)}`).toLowerCase().includes(f));

  $('reportKpis').innerHTML =
    `<div class="kpi"><div class="v">${REPORTS.length}</div><div class="l">Total reports</div></div>
     <div class="kpi"><div class="v">${new Set(REPORTS.map(r=>r.mockId+'|'+r.qNum)).size}</div><div class="l">Distinct questions</div></div>
     <div class="kpi"><div class="v">${REPORTS.filter(r=>tgtOf(r)==='question').length}</div><div class="l">On the question</div></div>
     <div class="kpi"><div class="v">${REPORTS.filter(r=>tgtOf(r)==='solution').length}</div><div class="l">On the solution</div></div>
     <div class="kpi"><div class="v">${new Set(REPORTS.map(r=>r.mockId)).size}</div><div class="l">Tests affected</div></div>`;

  // Aggregate by test + question
  const agg = {};
  rows.forEach(r=>{
    const k = r.mockId+' · Q'+(r.qNum||'?');
    agg[k] = agg[k] || {mockId:r.mockId, qNum:r.qNum, count:0, reasons:{}, last:0, note:'', parts:{question:0,solution:0}};
    agg[k].count++;
    agg[k].parts[tgtOf(r)]++;
    agg[k].reasons[r.reason||'—'] = (agg[k].reasons[r.reason||'—']||0)+1;
    const ms = tsMs(r); if(ms>agg[k].last){ agg[k].last=ms; if(r.note) agg[k].note=r.note; }
  });
  const aggArr = Object.entries(agg).sort((a,b)=>b[1].count-a[1].count);
  $('reportAgg').innerHTML = aggArr.length ? `<table><tr><th>Test · Q</th><th>#</th><th>Part</th><th>Reasons</th><th>Latest note</th><th></th></tr>` +
    aggArr.map(([k,v])=>`<tr><td><code>${esc(v.mockId)}</code><br><b>Q${esc(v.qNum)}</b></td>
      <td><span class="pill">${v.count}</span></td>
      <td style="white-space:nowrap">${v.parts.question?`<span class="pill qn">Question ×${v.parts.question}</span>`:''}${v.parts.solution?`<span class="pill sol">Solution ×${v.parts.solution}</span>`:''}</td>
      <td>${Object.entries(v.reasons).map(([rn,c])=>`<span class="pill b">${esc(rn)} ×${c}</span>`).join('')}</td>
      <td class="muted">${esc(v.note||'')}</td>
      <td style="white-space:nowrap"><button class="fix" data-mockid="${esc(v.mockId)}" data-qnum="${esc(v.qNum)}" title="Analyse with AI and propose a correction">✨ AI Fix</button><button class="del" data-act="delq" data-mockid="${esc(v.mockId)}" data-qnum="${esc(v.qNum)}" title="Fixed — clear all reports for this question">🗑 Clear ${v.count}</button></td></tr>`).join('') + `</table>`
    : `<div class="muted">No reports${f?' match this filter':''}.</div>`;

  // Raw list
  const list = rows.slice().sort((a,b)=>tsMs(b)-tsMs(a));
  $('reportList').innerHTML = list.length ? `<table><tr><th>When</th><th>Src</th><th>Part</th><th>Test · Q</th><th>Reason</th><th>Note</th><th>By</th><th></th></tr>` +
    list.map(r=>`<tr><td class="muted">${esc(fmtTime(r.createdAt))}</td>
      <td>${srcPill(r)}</td>
      <td>${tgtPill(r)}</td>
      <td><code>${esc(r.mockId)}</code> · Q${esc(r.qNum)}</td>
      <td><span class="pill">${esc(r.reason||'—')}</span></td>
      <td>${esc(r.note||'')}</td>
      <td class="muted">${esc(r.name||r.uid||'')}</td>
      <td><button class="del" data-act="delr" data-id="${esc(r.id)}" title="Delete this report">🗑</button></td></tr>`).join('') + `</table>`
    : `<div class="muted">No reports${f?' match this filter':''}.</div>`;
};

window.renderRatings = function(){
  const f = ($('ratingFilter').value||'').toLowerCase();
  const rows = RATINGS.filter(r => !f || (`${r.mockId} ${r.testName}`).toLowerCase().includes(f));

  const allStars = RATINGS.map(r=>Number(r.stars)||0).filter(Boolean);
  const overall = allStars.length ? (allStars.reduce((a,b)=>a+b,0)/allStars.length) : 0;
  $('ratingKpis').innerHTML =
    `<div class="kpi"><div class="v">${RATINGS.length}</div><div class="l">Total ratings</div></div>
     <div class="kpi"><div class="v">${overall.toFixed(2)}</div><div class="l">Avg stars (all)</div></div>
     <div class="kpi"><div class="v">${new Set(RATINGS.map(r=>r.mockId)).size}</div><div class="l">Tests rated</div></div>`;

  const DIFFS = ["Same as CGL","Easy","Difficult","Very Difficult"];
  const COLORS = {"Same as CGL":"#6366F1","Easy":"#22C55E","Difficult":"#F59E0B","Very Difficult":"#EF4444"};
  const agg = {};
  rows.forEach(r=>{
    const k=r.mockId||'(none)';
    agg[k]=agg[k]||{count:0,sum:0,diff:{}};
    agg[k].count++; agg[k].sum+=(Number(r.stars)||0);
    if(r.difficulty){ agg[k].diff[r.difficulty]=(agg[k].diff[r.difficulty]||0)+1; }
  });
  const arr = Object.entries(agg).sort((a,b)=>b[1].count-a[1].count);
  $('ratingAgg').innerHTML = arr.length ? `<table><tr><th>Test</th><th>#</th><th>Avg</th><th>Difficulty</th><th></th></tr>` +
    arr.map(([k,v])=>{
      const avg=v.count?(v.sum/v.count):0;
      const total=Object.values(v.diff).reduce((a,b)=>a+b,0)||1;
      const bar = DIFFS.map(d=>{ const c=v.diff[d]||0; const pct=Math.round(c/total*100); return c?`<i style="width:${pct}%;background:${COLORS[d]}" title="${d}: ${c}"></i>`:''; }).join('');
      const legend = DIFFS.map(d=>v.diff[d]?`<span class="pill b" style="background:#F1F5F9;color:#475569">${d}: ${v.diff[d]}</span>`:'').join('');
      return `<tr><td><code>${esc(k)}</code></td>
        <td>${v.count}</td>
        <td><span class="stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span> ${avg.toFixed(2)}</td>
        <td><div class="diffbar">${bar}</div><div style="margin-top:4px;">${legend}</div></td>
        <td><button class="del" data-act="delt" data-mockid="${esc(k)}" title="Delete all ratings for this test">🗑 Clear ${v.count}</button></td></tr>`;
    }).join('') + `</table>`
    : `<div class="muted">No ratings${f?' match this filter':''}.</div>`;
};

// ── Delete actions (admin only; enforced by Firestore rules too) ──
async function delMany(coll, ids){
  await Promise.all(ids.map(id=>deleteDoc(doc(db, coll, id)).catch(e=>{ throw e; })));
}
document.addEventListener('click', async (e)=>{
  const b = e.target.closest('button.del'); if(!b) return;
  const act = b.dataset.act;
  const orig = b.textContent;
  try{
    if(act==='delr'){
      const id = b.dataset.id;
      if(!confirm('Delete this single report?')) return;
      b.disabled=true; b.textContent='…';
      await delMany('question_reports', [id]);
      REPORTS = REPORTS.filter(r=>r.id!==id);
      renderReports();
    } else if(act==='delq'){
      const mid=b.dataset.mockid, qn=String(b.dataset.qnum);
      const ids = REPORTS.filter(r=>String(r.mockId)===mid && String(r.qNum)===qn).map(r=>r.id);
      if(!ids.length) return;
      if(!confirm(`Question fixed?\n\nThis will delete ${ids.length} report(s) for ${mid} · Q${qn}. This cannot be undone.`)) return;
      b.disabled=true; b.textContent='…';
      await delMany('question_reports', ids);
      REPORTS = REPORTS.filter(r=>!(String(r.mockId)===mid && String(r.qNum)===qn));
      renderReports();
    } else if(act==='delt'){
      const mid=b.dataset.mockid;
      const ids = RATINGS.filter(r=>String(r.mockId)===mid).map(r=>r.id);
      if(!ids.length) return;
      if(!confirm(`Delete all ${ids.length} rating(s) for ${mid}? This cannot be undone.`)) return;
      b.disabled=true; b.textContent='…';
      await delMany('mock_ratings', ids);
      RATINGS = RATINGS.filter(r=>String(r.mockId)!==mid);
      renderRatings();
    }
  }catch(err){
    b.disabled=false; b.textContent=orig;
    const code=''+((err&&(err.code||err.message))||'');
    alert(code.indexOf('permission')>=0
      ? 'Delete blocked by Firestore rules. Make sure admin delete is allowed for this collection (see the rules note).'
      : 'Could not delete: '+(code||'unknown error'));
  }
});

/* ══════════════════════════════════════════════════════════════════
   AI AUTO-CORRECT
   Locate the flagged question doc(s) → send to Claude with the
   candidate's complaint → preview an editable field-level diff →
   approve → write to Firestore + audit log.
   ══════════════════════════════════════════════════════════════════ */

// ── Config: adjust these if your worker/collections differ ──
const AI_ENDPOINT   = "https://trickyssc-ai.nirala01.workers.dev";
const AI_MODEL      = "claude-opus-5";          // accuracy matters here — keep it on Opus. Must match what your worker allows.
const AI_MAX_TOKENS = 8000;
const Q_COLLECTIONS = ["questions"];            // where question docs live
const X_COLLECTIONS = ["solutions"];            // optional extra collections using the same doc-id convention
const AUDIT_COLL    = "question_fixes";         // every applied correction is logged here
const ID_FIELDS     = ["paperId","mockId","testId","paper_id","mock_id"];
const NUM_FIELDS    = ["qNum","questionNumber","qNo","qno","number","serial","position","q"];

let FIX = null;   // live state for the open modal

const getPath = (o,p) => p.split('.').reduce((x,k)=> (x==null?undefined:x[k]), o);
const twinId  = s => String(s).replace(/_en$/i,'_hi').replace(/-en$/i,'-hi');
const isEn    = s => /[_-]en$/i.test(String(s));
const isHi    = s => /[_-]hi$/i.test(String(s));

function idCandidates(base, qn){
  const n = parseInt(qn,10), out = [];
  if(!isNaN(n)){
    out.push(`${base}_q${String(n).padStart(3,'0')}`);
    out.push(`${base}_q${String(n).padStart(2,'0')}`);
    out.push(`${base}_q${n}`);
    out.push(`${base}_Q${String(n).padStart(3,'0')}`);
  }
  out.push(`${base}_q${qn}`);
  return [...new Set(out)];
}

// Probe once per collection to learn which id/number fields this data uses
async function probeSchema(coll, baseId){
  for(const idf of ID_FIELDS){
    try{
      const s = await getDocs(query(collection(db,coll), where(idf,'==',baseId), limit(1)));
      if(!s.empty){
        const d = s.docs[0].data();
        const nf = NUM_FIELDS.find(f => d[f] !== undefined) || null;
        return {idf, nf};
      }
    }catch(_){}
  }
  return null;
}

async function findOne(coll, baseId, qn){
  // 1) deterministic doc id
  for(const cand of idCandidates(baseId, qn)){
    try{
      const snap = await getDoc(doc(db, coll, cand));
      if(snap.exists()) return {coll, id:snap.id, data:snap.data()};
    }catch(_){}
  }
  // 2) query fallback (legacy random-id docs)
  const sch = await probeSchema(coll, baseId);
  if(sch && sch.nf){
    const n = parseInt(qn,10);
    for(const val of (isNaN(n) ? [String(qn)] : [n, String(n)])){
      try{
        const s = await getDocs(query(collection(db,coll),
          where(sch.idf,'==',baseId), where(sch.nf,'==',val), limit(2)));
        if(!s.empty) return {coll, id:s.docs[0].id, data:s.docs[0].data()};
      }catch(_){}
    }
  }
  return null;
}

async function locateDocs(baseId, qn){
  const bases = [baseId];
  const t = twinId(baseId);
  if(t !== baseId) bases.push(t);              // pull the Hindi/English twin too
  const found = [];
  for(const b of bases){
    for(const coll of [...Q_COLLECTIONS, ...X_COLLECTIONS]){
      const hit = await findOne(coll, b, qn);
      if(hit) found.push({...hit, base:b, lang: isHi(b) ? 'hi' : (isEn(b) ? 'en' : '?')});
    }
  }
  return found;
}

// ── Open ───────────────────────────────────────────────────────────
window.openFix = async function(mockId, qNum){
  const reports = REPORTS.filter(r => String(r.mockId)===String(mockId) && String(r.qNum)===String(qNum));
  FIX = {mockId, qNum, reports, docs:[], ai:null, changes:[]};
  $('fixModal').classList.remove('hidden');
  $('fixTitle').textContent = `AI correction · ${mockId} · Q${qNum}`;
  $('fixFoot').innerHTML = '';
  $('fixBody').innerHTML = `<div class="steps"><b>1 · Locating</b> → 2 · Analysing → 3 · Preview → 4 · Apply</div>
    <div style="text-align:center;padding:30px;"><div class="spin"></div>
    <div class="muted" style="margin-top:10px;">Finding the question in Firestore…</div></div>`;

  try{
    FIX.docs = await locateDocs(mockId, qNum);
  }catch(e){
    return fail('Lookup failed: '+(e.message||e));
  }
  if(!FIX.docs.length){
    return fail(`Couldn't find a document for <code>${esc(mockId)}</code> Q${esc(qNum)} in ${[...Q_COLLECTIONS,...X_COLLECTIONS].join(', ')}.<br>
      <span class="muted">Check the collection names / id convention in the config block at the top of the AI AUTO-CORRECT section.</span>`);
  }
  renderStage2();
};

function fail(html){
  $('fixBody').innerHTML = `<div class="verdict v-fix">${html}</div>`;
  $('fixFoot').innerHTML = `<button class="btn btn-ghost" onclick="closeFix()">Close</button>`;
}

window.closeFix = function(){ $('fixModal').classList.add('hidden'); FIX = null; };

// ── Stage 2: show what was found, offer to analyse ─────────────────
function docCard(d, i){
  const rows = Object.entries(d.data)
    .filter(([k,v]) => typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean')
    .map(([k,v]) => `<div style="margin:3px 0;"><span class="lbl">${esc(k)}</span><div class="qtext">${esc(v)}</div></div>`)
    .join('');
  return `<div class="sec">
    <h3>D${i+1} <span class="docpill">${esc(d.coll)}/${esc(d.id)}</span> ${d.lang!=='?'?`<span class="pill b">${d.lang.toUpperCase()}</span>`:''}</h3>
    ${rows}
    <details style="margin-top:8px;"><summary class="muted" style="cursor:pointer;">Full JSON</summary>
      <pre style="font-size:11px;overflow:auto;background:#F8FAFC;padding:8px;border-radius:8px;">${esc(JSON.stringify(d.data,null,1))}</pre></details>
  </div>`;
}

function renderStage2(){
  const rep = FIX.reports.map(r =>
    `<div style="margin-bottom:6px;">${tgtPill(r)}<span class="pill">${esc(r.reason||'—')}</span>
     <span class="muted">${esc(r.note||'(no note)')}</span>
     <span class="muted"> — ${esc(r.name||r.uid||'')}, ${esc(fmtTime(r.createdAt))}</span></div>`).join('');
  $('fixBody').innerHTML =
    `<div class="steps">1 · Located → <b>2 · Analyse</b> → 3 · Preview → 4 · Apply</div>
     <div class="sec"><h3>Candidate reports (${FIX.reports.length})</h3>${rep||'<span class="muted">none</span>'}</div>
     ${FIX.docs.map(docCard).join('')}`;
  $('fixFoot').innerHTML =
    `<button class="btn btn-orange" id="goAI">✨ Analyse &amp; propose correction</button>
     <button class="btn btn-ghost" onclick="closeFix()">Cancel</button>
     <span class="muted" style="margin-left:auto;">Nothing is written until you approve.</span>`;
  $('goAI').onclick = runAI;
}

// ── Stage 3: call Claude ───────────────────────────────────────────
function buildPrompt(){
  const L = [];
  L.push("You are a senior SSC exam content reviewer for TrickySSC, an SSC exam-prep platform.");
  L.push("A candidate has flagged a question, or its solution, during a test. Your job is to decide whether the stored content is actually wrong, and if so to produce the minimum set of field edits that fix it.");
  L.push("Each report says which part it is about: PART=question (raised on the question/options while attempting) or PART=solution (raised on the explanation / trick / concept shown in the review screen).");
  L.push("");
  L.push("### Candidate reports");
  FIX.reports.forEach(r => L.push(`- PART: ${tgtOf(r)} | Reason: ${r.reason||'—'} | Note: ${r.note||'(none)'}`));
  L.push("");
  L.push(`### Test: ${FIX.mockId} · Question number ${FIX.qNum}`);
  L.push("");
  L.push("### Stored documents");
  FIX.docs.forEach((d,i) => {
    L.push(`D${i+1} (${d.coll}/${d.id}, language=${d.lang}):`);
    L.push("```json");
    L.push(JSON.stringify(d.data, null, 1));
    L.push("```");
  });
  L.push("");
  L.push("### How to judge");
  L.push("1. SOLVE THE QUESTION YOURSELF from first principles before reading the stored answer. Do not assume the reporter is right — candidates are often wrong. If the stored content is correct, say so and return no changes.");
  L.push("2. If it IS wrong, work out exactly which fields carry the error.");
  L.push("2b. For PART=solution reports the answer key is usually fine and the fault is in explanation / trick / concept — a wrong step, a wrong figure, a missing step, or a solution that derives a different option from the stored answer. Verify the key anyway, but do not rewrite a correct key just because the working is sloppy; fix the working instead.");
  L.push("3. If the answer key changes, you MUST also edit every solution / explanation / trick field that states or derives the old option — in EVERY document above, English and Hindi — so nothing contradicts. A half-fixed question is worse than an unfixed one.");
  L.push("4. Preserve the existing formatting conventions exactly: KaTeX wrapped in \\( \\), [BR] for line breaks, <u> tags, || option separators, inline HTML in solution fields, green/orange styled blocks. Match the surrounding style of the field you are editing.");
  L.push("5. Never translate. Edit Hindi documents in Hindi, English documents in English.");
  L.push("6. Do not rewrite anything that is not wrong. Minimal edits only.");
  L.push("7. For nested fields use dot notation exactly as it appears in the JSON, e.g. options.A");
  L.push("");
  L.push("### Output");
  L.push("Return ONLY a JSON object, no markdown fences, no commentary before or after:");
  L.push('{');
  L.push('  "verdict": "fix_needed" | "no_change" | "unclear",');
  L.push('  "confidence": "high" | "medium" | "low",');
  L.push('  "correct_answer": "the option letter you independently derived, or null",');
  L.push('  "diagnosis": "2-5 sentences: what you worked out, and what exactly is wrong (or why the report is mistaken)",');
  L.push('  "reporter_assessment": "one line — was the candidate right?",');
  L.push('  "changes": [ { "doc": "D1", "field": "answer", "new": "B", "why": "short reason" } ],');
  L.push('  "clear_reports": true');
  L.push('}');
  L.push('If verdict is "no_change" or "unclear", "changes" must be an empty array.');
  return L.join("\n");
}

function parseAI(raw){
  let t = String(raw||'').trim();
  t = t.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try{ return JSON.parse(t); }catch(_){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(_){} }
  return null;
}

async function runAI(){
  $('fixBody').innerHTML = `<div class="steps">1 · Located → <b>2 · Analysing</b> → 3 · Preview → 4 · Apply</div>
    <div style="text-align:center;padding:34px;"><div class="spin"></div>
    <div class="muted" style="margin-top:10px;">Claude is solving the question and checking the stored content…</div></div>`;
  $('fixFoot').innerHTML = `<button class="btn btn-ghost" onclick="closeFix()">Cancel</button>`;
  let raw = '';
  try{
    const res = await fetch(AI_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: AI_MODEL,
        max_tokens: AI_MAX_TOKENS,
        messages:[{role:'user', content: buildPrompt()}]
      })
    });
    const j = await res.json().catch(()=>null);
    if(!res.ok) throw new Error(`HTTP ${res.status} — ${JSON.stringify(j||'').slice(0,300)}`);
    raw = Array.isArray(j?.content)
      ? j.content.filter(b=>b.type==='text').map(b=>b.text).join('\n')
      : (j?.text || j?.completion || j?.output_text || (typeof j==='string'? j : ''));
  }catch(e){
    return fail(`AI request failed: ${esc(e.message||e)}<br><span class="muted">Check that <code>${esc(AI_ENDPOINT)}</code> accepts a standard Anthropic messages body and allows <code>${esc(AI_MODEL)}</code>.</span>`);
  }
  const ai = parseAI(raw);
  if(!ai) return fail(`Couldn't parse the AI response as JSON.<br><pre style="font-size:11px;white-space:pre-wrap;">${esc(String(raw).slice(0,1500))}</pre>`);
  FIX.ai = ai;
  FIX.changes = (ai.changes||[]).map((c,i) => {
    const di = Math.max(0, parseInt(String(c.doc||'D1').replace(/\D/g,''),10)-1);
    const d  = FIX.docs[di] || FIX.docs[0];
    return {i, d, field:String(c.field||''), old:getPath(d.data, String(c.field||'')), val:c.new, why:c.why||'', on:true};
  }).filter(c => c.field);
  renderStage3();
}

// ── Stage 4: editable preview ──────────────────────────────────────
function renderStage3(){
  const ai = FIX.ai;
  const cls = ai.verdict==='fix_needed' ? 'v-fix' : (ai.verdict==='no_change' ? 'v-no' : 'v-un');
  const head = ai.verdict==='fix_needed' ? '⚠ Correction proposed'
             : ai.verdict==='no_change'  ? '✓ No change needed — the stored content looks correct'
             : '? Unclear — needs your eyes';
  let html = `<div class="steps">1 · Located → 2 · Analysed → <b>3 · Review</b> → 4 · Apply</div>
    <div class="verdict ${cls}"><b>${head}</b> <span class="muted">(confidence: ${esc(ai.confidence||'?')})</span>
      <div style="margin-top:6px;">${esc(ai.diagnosis||'')}</div>
      ${ai.correct_answer?`<div style="margin-top:6px;"><span class="lbl">Independently derived answer</span> <b>${esc(ai.correct_answer)}</b></div>`:''}
      ${ai.reporter_assessment?`<div class="why">Reporter: ${esc(ai.reporter_assessment)}</div>`:''}
    </div>`;

  if(FIX.changes.length){
    html += `<div class="sec"><h3>Proposed edits (${FIX.changes.length}) — editable</h3>`;
    FIX.changes.forEach(c => {
      const oldTxt = c.old===undefined ? '(field does not exist yet)' : (typeof c.old==='object'? JSON.stringify(c.old) : String(c.old));
      const newTxt = typeof c.val==='object'? JSON.stringify(c.val) : String(c.val==null?'':c.val);
      const rows = Math.min(14, Math.max(1, Math.ceil(newTxt.length/95) + (newTxt.match(/\n/g)||[]).length));
      html += `<div class="fieldrow">
        <label style="display:flex;gap:8px;align-items:center;">
          <input type="checkbox" data-ci="${c.i}" class="ck" checked>
          <span class="fn">${esc(c.d.coll)}/${esc(c.d.id)} → ${esc(c.field)}</span>
        </label>
        <div class="lbl" style="margin-top:6px;">Current</div><div class="old">${esc(oldTxt)}</div>
        <div class="lbl">Corrected</div><textarea class="new" rows="${rows}" data-ci="${c.i}">${esc(newTxt)}</textarea>
        ${c.why?`<div class="why">↳ ${esc(c.why)}</div>`:''}
      </div>`;
    });
    html += `</div>`;
  }
  $('fixBody').innerHTML = html;

  $('fixBody').querySelectorAll('textarea.new').forEach(t => {
    t.oninput = () => { const c = FIX.changes.find(x=>x.i==t.dataset.ci); if(c) c.val = t.value; };
  });
  $('fixBody').querySelectorAll('input.ck').forEach(k => {
    k.onchange = () => { const c = FIX.changes.find(x=>x.i==k.dataset.ci); if(c) c.on = k.checked; };
  });

  const nRep = FIX.reports.length;
  $('fixFoot').innerHTML =
    (FIX.changes.length
      ? `<button class="btn btn-green" id="apply">✓ Approve &amp; update Firestore</button>`
      : '') +
    `<label class="muted" style="display:flex;gap:6px;align-items:center;">
       <input type="checkbox" id="alsoClear" ${FIX.ai.clear_reports!==false?'checked':''}> also clear the ${nRep} report(s)</label>
     <button class="btn btn-ghost" onclick="closeFix()">Close without changing</button>`;
  const ap = $('apply'); if(ap) ap.onclick = applyFix;
}

// ── Stage 5: write ─────────────────────────────────────────────────
async function applyFix(){
  const picked = FIX.changes.filter(c => c.on);
  if(!picked.length) return alert('Nothing selected.');
  const btn = $('apply'); btn.disabled = true; btn.textContent = 'Writing…';
  try{
    const byDoc = new Map();
    picked.forEach(c => {
      const key = c.d.coll+'/'+c.d.id;
      if(!byDoc.has(key)) byDoc.set(key, {d:c.d, patch:{}});
      byDoc.get(key).patch[c.field] = c.val;
    });
    for(const {d,patch} of byDoc.values()){
      await updateDoc(doc(db, d.coll, d.id), patch);
    }
    // audit trail
    try{
      await addDoc(collection(db, AUDIT_COLL), {
        mockId: FIX.mockId, qNum: FIX.qNum,
        by: auth.currentUser?.email || auth.currentUser?.uid || '',
        at: serverTimestamp(),
        verdict: FIX.ai.verdict, confidence: FIX.ai.confidence||'',
        diagnosis: FIX.ai.diagnosis||'',
        reportReasons: FIX.reports.map(r=>r.reason||''),
        reportNotes: FIX.reports.map(r=>r.note||''),
        changes: picked.map(c => ({
          docPath: c.d.coll+'/'+c.d.id, field: c.field,
          old: c.old===undefined ? null : (typeof c.old==='object'? JSON.stringify(c.old) : String(c.old)),
          new: typeof c.val==='object'? JSON.stringify(c.val) : String(c.val==null?'':c.val)
        }))
      });
    }catch(e){ console.warn('audit log failed', e); }

    let cleared = 0;
    if($('alsoClear')?.checked){
      const ids = FIX.reports.map(r=>r.id);
      await delMany('question_reports', ids);
      REPORTS = REPORTS.filter(r => !ids.includes(r.id));
      cleared = ids.length;
      renderReports();
    }
    $('fixBody').innerHTML = `<div class="verdict v-no"><b>✓ Updated</b><br>
      ${picked.length} field(s) written across ${byDoc.size} document(s)${cleared?`, ${cleared} report(s) cleared`:''}.
      <div class="why">Logged to <code>${esc(AUDIT_COLL)}</code>. Purge the Cloudflare cache if the test page still shows the old text.</div></div>`;
    $('fixFoot').innerHTML = `<button class="btn btn-orange" onclick="closeFix()">Done</button>`;
  }catch(e){
    btn.disabled=false; btn.textContent='✓ Approve & update Firestore';
    const code = ''+((e&&(e.code||e.message))||'');
    alert(code.includes('permission')
      ? `Write blocked by Firestore rules. Allow admin writes on the questions collection and on ${AUDIT_COLL}.`
      : 'Could not update: '+code);
  }
}

document.addEventListener('click', (e)=>{
  const b = e.target.closest('button.fix'); if(!b) return;
  openFix(b.dataset.mockid, b.dataset.qnum);
});

window.showTab = function(t){
  $('tabReports').classList.toggle('active', t==='reports');
  $('tabRatings').classList.toggle('active', t==='ratings');
  $('reportsView').classList.toggle('hidden', t!=='reports');
  $('ratingsView').classList.toggle('hidden', t!=='ratings');
};

window.downloadCsv = function(which){
  let rows, name;
  const q = s => '"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  if(which==='reports'){
    name='question_reports.csv';
    rows=[['when','source','part','mockId','qNum','position','subject','reason','note','name','uid','testName']];
    REPORTS.slice().sort((a,b)=>tsMs(b)-tsMs(a)).forEach(r=>rows.push([fmtTime(r.createdAt),r.source||'mock',tgtOf(r),r.mockId,r.qNum,r.position,r.subject,r.reason,r.note,r.name,r.uid,r.testName]));
  } else {
    name='mock_ratings.csv';
    rows=[['when','mockId','stars','difficulty','name','uid','testName']];
    RATINGS.slice().sort((a,b)=>tsMs(b)-tsMs(a)).forEach(r=>rows.push([fmtTime(r.createdAt),r.mockId,r.stars,r.difficulty,r.name,r.uid,r.testName]));
  }
  const csv = rows.map(r=>r.map(q).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
};
