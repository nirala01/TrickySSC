<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English-paper diagnostic — TrickySSC</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0F172A;color:#E2E8F0;margin:0;padding:18px;}
  h1{font-size:18px;margin:0 0 4px;color:#FF8C42;}
  p.sub{font-size:12px;color:#94A3B8;margin:0 0 16px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  input{flex:1;min-width:220px;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid #334155;background:#1E293B;color:#E2E8F0;}
  button{font-size:14px;font-weight:700;padding:10px 18px;border-radius:8px;border:0;background:#FF6B00;color:#fff;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  .card{background:#1E293B;border:1px solid #334155;border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .card h2{font-size:14px;margin:0 0 8px;color:#FBBF24;}
  code{background:#0B1220;padding:2px 6px;border-radius:5px;color:#7DD3FC;word-break:break-all;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #334155;vertical-align:top;word-break:break-all;}
  th{color:#94A3B8;font-weight:600;}
  .ok{color:#34D399;font-weight:700;}
  .no{color:#F87171;font-weight:700;}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#334155;color:#CBD5E1;margin-left:6px;}
  .muted{color:#94A3B8;font-size:12px;}
  .big{font-size:15px;}
  tr.hl td{background:#064E3B;}
</style>
</head>
<body>
  <h1>&#128269; English-paper diagnostic (v2 &middot; REST)</h1>
  <p class="sub">Paste the <b>Hindi</b> paper/mock URL (or its id) and press Diagnose. Reads only &mdash; changes nothing.</p>
  <div class="row">
    <input id="pid" placeholder="paste the full test/mock URL" />
    <button id="go" onclick="run()">Diagnose</button>
  </div>
  <div id="out"></div>

<script>
const PROJECT = "trickyssc-17bb3";
const APIKEY  = "AIzaSyC4kjEYEZ6Zit9su9V5xpUhMd7vLhE90zA";
const RQ = "https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents:runQuery?key=" + APIKEY;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const u = new URLSearchParams(location.search);
if (u.get('paper')) $('pid').value = u.get('paper');

function unwrap(v){
  if(v==null) return undefined;
  if('stringValue' in v) return v.stringValue;
  if('integerValue' in v) return v.integerValue;
  if('doubleValue' in v) return v.doubleValue;
  if('booleanValue' in v) return v.booleanValue;
  if('nullValue' in v) return null;
  return JSON.stringify(v);
}
function fromRest(j){
  const out=[];
  if(Array.isArray(j)) for(const row of j){ if(row.document&&row.document.fields){ const f=row.document.fields,o={}; for(const k in f) o[k]=unwrap(f[k]); out.push(o); } }
  return out;
}
async function restQuery(filters, coll, lim){
  coll=coll||'questions'; lim=lim||2000;
  const body={structuredQuery:{from:[{collectionId:coll}],where:{compositeFilter:{op:'AND',filters}},limit:lim}};
  const r=await fetch(RQ,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160)); }
  return fromRest(await r.json());
}
function eqStr(field,val){ return {fieldFilter:{field:{fieldPath:field},op:'EQUAL',value:{stringValue:val}}}; }
function eqInt(field,val){ return {fieldFilter:{field:{fieldPath:field},op:'EQUAL',value:{integerValue:String(val)}}}; }

async function byPaperId(pid){ return await restQuery([eqStr('paperId',pid)]); }
async function byExamYear(exam,year,heldOn){
  const base=[eqStr('exam',exam)];
  const yStr=String(year), yNum=parseInt(year);
  const tries=[];
  if(year!=='' && year!=null){
    if(heldOn){ tries.push([...base,eqStr('year',yStr),eqStr('heldOn',heldOn)]);
                if(!isNaN(yNum)) tries.push([...base,eqInt('year',yNum),eqStr('heldOn',heldOn)]); }
    tries.push([...base,eqStr('year',yStr)]);
    if(!isNaN(yNum)) tries.push([...base,eqInt('year',yNum)]);
  } else { tries.push([...base]); }
  for(const f of tries){ try{ const d=await restQuery(f); if(d.length) return d; }catch(e){} }
  return [];
}
async function getMockDoc(id){
  const url="https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents/mock_tests/" + encodeURIComponent(id) + "?key=" + APIKEY;
  const r=await fetch(url); if(!r.ok) return null; const j=await r.json(); if(!j.fields) return null;
  const o={}; for(const k in j.fields) o[k]=unwrap(j.fields[k]); return o;
}
function parseInput(raw){
  raw=(raw||'').trim(); let id=raw, F={};
  if(/^https?:\/\//i.test(raw) || raw.indexOf('?')>=0){
    let qs; try{ qs=new URL(raw).searchParams; }catch(_){ const i=raw.indexOf('?'); qs=new URLSearchParams(i>=0?raw.slice(i+1):raw); }
    id=(qs.get('paperId')||qs.get('mockId')||'').trim()||id;
    F={exam:qs.get('exam')||'',year:qs.get('year')||'',tier:qs.get('tier')||'',heldOn:qs.get('heldOn')||'',shift:qs.get('shift')||'',series:qs.get('series')||'',mockId:qs.get('mockId')||''};
  }
  return {id,F,isMock:/mock/i.test(id)||!!F.mockId};
}
function groupByPaperLang(docs){
  const g={};
  docs.forEach(d=>{ const p=d.paperId||d.mockId||'(none)'; const l=(d.language!=null&&d.language!=='')?d.language:'(none)';
    g[p]=g[p]||{n:0,langs:{}}; g[p].n++; g[p].langs[l]=(g[p].langs[l]||0)+1; });
  return g;
}

window.run = async function(){
  const parsed=parseInput($('pid').value); const pid=parsed.id, F=parsed.F, isMock=parsed.isMock;
  if(!pid) return;
  $('go').disabled=true; $('out').innerHTML='<div class="card muted">Reading database via REST&hellip;</div>';
  let html='<div class="card muted">Querying id: <code>'+esc(pid)+'</code>'+(isMock?' <span class="pill">mock</span>':'')+'</div>';

  try{
    if(isMock){
      const hiMeta = await getMockDoc(pid);
      const exam = (hiMeta&&hiMeta.exam) || F.exam;
      const yv = hiMeta ? (hiMeta.yearValue||hiMeta.seriesNum||F.series) : F.series;
      html += '<div class="card"><h2>1 &middot; mock_tests/<code>'+esc(pid)+'</code></h2>'+
        (hiMeta ? '<div class="ok">&#10003; exists</div><table style="margin-top:6px;"><tr><th>exam</th><th>yearValue</th><th>seriesNum</th><th>title</th></tr><tr><td>'+esc(hiMeta.exam)+'</td><td>'+esc(hiMeta.yearValue)+'</td><td>'+esc(hiMeta.seriesNum)+'</td><td>'+esc(hiMeta.title)+'</td></tr></table>'
                : '<div class="no">&#10007; no mock_tests doc with this id</div>')+'</div>';

      const base = pid.replace(/([_\-])(hi|hindi)$/i,'');
      const cands=[...new Set([pid.replace(/_hi$/,'_en').replace(/_hindi$/,'_english'),base+'_en',base+'_english',base+'-en',base])].filter(x=>x&&x!==pid);
      let crows='', enMetaId='';
      for(const c of cands){ const m=await getMockDoc(c); if(m&&!enMetaId){enMetaId=c;}
        crows+='<tr class="'+(m?'hl':'')+'"><td><code>'+esc(c)+'</code></td><td class="'+(m?'ok':'no')+'">'+(m?'&#10003; exists':'&mdash;')+'</td></tr>'; }
      html += '<div class="card"><h2>2 &middot; Candidate English mock_tests docs</h2><table><tr><th>candidate mockId</th><th>exists?</th></tr>'+crows+'</table>'+
        (enMetaId?'<p class="ok" style="margin:8px 0 0;">English mock doc: <code>'+esc(enMetaId)+'</code></p>':'<p class="no" style="margin:8px 0 0;">No English mock_tests doc found under these ids.</p>')+'</div>';

      if(exam && yv!=='' && yv!=null){
        const docs = await byExamYear(exam, yv, '');
        const g = groupByPaperLang(docs);
        const rows = Object.keys(g).sort().map(p=>'<tr><td><code>'+esc(p)+'</code></td><td>'+g[p].n+'</td><td>'+esc(Object.entries(g[p].langs).map(kv=>kv[0]+':'+kv[1]).join(', '))+'</td></tr>').join('');
        html += '<div class="card"><h2>3 &middot; questions where exam=<code>'+esc(exam)+'</code> &middot; year/series=<code>'+esc(yv)+'</code></h2><p class="muted">How the mock&#39;s questions are actually stored (by paperId + language).</p><table><tr><th>paperId / mockId</th><th>#</th><th>languages</th></tr>'+(rows||'<tr><td colspan=3 class="muted">0 docs.</td></tr>')+'</table></div>';
      }
    } else {
      const exam=F.exam, year=F.year, heldOn=F.heldOn;
      let exact=[]; try{ exact=await byPaperId(pid); }catch(e){}
      html += '<div class="card"><h2>1 &middot; Direct lookup <code>paperId == '+esc(pid)+'</code></h2><div class="big '+(exact.length?'ok':'no')+'">'+(exact.length?('&#10003; '+exact.length+' docs'):'&#10007; 0 docs (the page loads this paper another way)')+'</div></div>';

      const docs = await byExamYear(exam, year, heldOn);
      const g = groupByPaperLang(docs);
      const rows = Object.keys(g).sort().map(p=>{
        const langs=Object.entries(g[p].langs).map(kv=>kv[0]+':'+kv[1]).join(', ');
        const hasEn=Object.keys(g[p].langs).some(l=>/^(en|eng|english)$/i.test(l));
        return '<tr class="'+(hasEn?'hl':'')+'"><td><code>'+esc(p)+'</code></td><td>'+g[p].n+'</td><td>'+esc(langs)+'</td></tr>';
      }).join('');
      html += '<div class="card"><h2>2 &middot; questions where exam=<code>'+esc(exam)+'</code> &middot; year=<code>'+esc(year)+'</code>'+(heldOn?(' &middot; heldOn=<code>'+esc(heldOn)+'</code>'):'')+'</h2><p class="muted">The query the page actually uses. Green rows contain an English (<code>en</code>/<code>english</code>) language.</p><table><tr><th>paperId</th><th>#</th><th>languages</th></tr>'+(rows||'<tr><td colspan=3 class="no">0 docs &mdash; exam/year fields may differ from the URL.</td></tr>')+'</table></div>';

      const langSet={}; docs.forEach(d=>{ const l=(d.language!=null&&d.language!=='')?d.language:'(none)'; langSet[l]=(langSet[l]||0)+1; });
      html += '<div class="card"><h2>3 &middot; Distinct <code>language</code> values for this paper</h2><table><tr><th>language</th><th># docs</th></tr>'+(Object.entries(langSet).map(kv=>'<tr><td><code>'+esc(kv[0])+'</code></td><td>'+kv[1]+'</td></tr>').join('')||'<tr><td colspan=2 class="muted">&mdash;</td></tr>')+'</table><p class="muted" style="margin-top:8px;">An English row here means the English version exists; the page just needs to match this <code>language</code> value.</p></div>';
    }
    html += '<div class="card muted">Screenshot the cards above and send them &mdash; that&#39;s the definitive answer.</div>';
  }catch(e){
    html += '<div class="card no">Error: '+esc(e.message||e)+'</div>';
  }
  $('out').innerHTML=html;
  $('go').disabled=false;
};
</script>
</body>
</html>
