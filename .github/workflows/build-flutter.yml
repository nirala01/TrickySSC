# .github/workflows/build-flutter.yml
#
# Builds the new TrickySSC Android app written in Flutter (flutter_app/).
# The android/ project folder is generated fresh by Flutter on every run, then
# tool/ci_prepare.py sets the app name, icons and Firebase settings.
# The APK is signed with the same upload key as before (the ANDROID_* secrets),
# so Google sign-in and, later, Google Play accept it.
# Download it from the run's page, under "Artifacts": trickyssc-flutter-apk (install on a phone)
# and trickyssc-flutter-aab (upload to Google Play Console).

name: Build Flutter app

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Live prices from admin-pricing (config/pricing)
        # Same public read the website does (tssc-pricing.js). Bundled as the app's fallback price list
        # and printed here, so every build shows the plans that are live.
        run: |
          set +e
          curl -sf "https://firestore.googleapis.com/v1/projects/trickyssc-17bb3/databases/(default)/documents/config/pricing?key=AIzaSyC4kjEYEZ6Zit9su9V5xpUhMd7vLhE90zA" -o "$RUNNER_TEMP/pricing.json"
          python3 - "$RUNNER_TEMP/pricing.json" flutter_app/assets/pricing.json <<'PY'
          import json, sys
          def d(v):
              if not isinstance(v, dict): return None
              for k in ('stringValue', 'booleanValue', 'timestampValue'):
                  if k in v: return v[k]
              if 'integerValue' in v: return int(v['integerValue'])
              if 'doubleValue' in v: return float(v['doubleValue'])
              if 'arrayValue' in v: return [d(x) for x in v['arrayValue'].get('values', [])]
              if 'mapValue' in v: return {k: d(x) for k, x in v['mapValue'].get('fields', {}).items()}
              return None
          try:
              cat = {k: d(v) for k, v in json.load(open(sys.argv[1])).get('fields', {}).items()}
          except Exception as e:
              print('::warning::Could not read config/pricing:', e); cat = {}
          cat.pop('payApi', None)
          json.dump(cat, open(sys.argv[2], 'w'), ensure_ascii=False, indent=1)
          print('%-26s %-42s %6s %6s %5s %4s  %s' % ('id', 'label', 'price', 'mrp', 'days', 'live', 'grants'))
          for p in sorted(cat.get('products', []), key=lambda p: p.get('order') or 0):
              print('%-26s %-42s %6s %6s %5s %4s  %s' % (p.get('id'), (p.get('label') or '')[:42], p.get('price'), p.get('mrp') or '', p.get('durationDays') or 365, 'yes' if p.get('live', True) else 'no', ', '.join(p.get('grants') or [])))
          PY
          exit 0

      - name: Generate the Android project
        run: |
          flutter create --org com.trickyssc --project-name app --platforms android "$RUNNER_TEMP/gen"
          python3 flutter_app/tool/ci_prepare.py "$RUNNER_TEMP/gen" flutter_app "$GITHUB_WORKSPACE"

      - name: Build
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=2.0.${{ github.run_number }} --dart-define=APP_VERSION=2.0.${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }} --build-name=2.0.${{ github.run_number }} --dart-define=APP_VERSION=2.0.${{ github.run_number }}

      - name: Sign with the upload key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS:-}" ]; then echo "::error::Signing secrets are missing."; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p out
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out out/trickyssc-flutter.apk flutter_app/build/app/outputs/flutter-apk/app-release.apk
          # Play upload bundle (.aab), signed with the same upload key. Flutter's release build already signs
          # the bundle with the debug key; Play rejects a bundle with two certificate chains, so the old
          # signature is removed first and the bundle carries the upload key only.
          cp flutter_app/build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/unsigned.aab"
          zip -q -d "$RUNNER_TEMP/unsigned.aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env KS_PASS -keypass:env KEY_PASS \
            -signedjar out/trickyssc-flutter.aab "$RUNNER_TEMP/unsigned.aab" "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"
          "$BT/apksigner" verify --print-certs out/trickyssc-flutter.apk | grep -i "SHA-256"
          jarsigner -verify out/trickyssc-flutter.aab | tail -1
          SIGS=$(unzip -l out/trickyssc-flutter.aab | grep -cE 'META-INF/[^/]+\.(RSA|DSA|EC)$' || true)
          echo "Signature blocks in the bundle: $SIGS"
          if [ "$SIGS" != "1" ]; then echo "::error::The bundle must carry exactly one signature (found $SIGS)."; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: trickyssc-flutter-apk
          path: out/trickyssc-flutter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trickyssc-flutter-aab
          path: out/trickyssc-flutter.aab
