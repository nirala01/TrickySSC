# Rebuilds the chapter-wise PYQ tests (pyq-chapters/*.json), the chapter-wise PYQ pages
# for SSC CGL / CHSL / GD and their sitemap block from the tagged questions in Firestore.
#
# Runs once a day (reads every PYQ question doc once: a few thousand Firestore reads)
# and whenever you press "Run workflow". After uploading + tagging a new paper, run it
# by hand if you don't want to wait for the night.

name: Build chapter-wise PYQ tests

on:
  schedule:
    - cron: '25 21 * * *'        # 02:55 IST daily
  workflow_dispatch:
    inputs:
      exam:
        description: 'Only this exam (ssc-cgl / ssc-chsl / ssc-gd); blank = all'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-pyq-chapters
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build tests and pages
        run: |
          if [ -n "${{ github.event.inputs.exam }}" ]; then
            python scripts/build_pyq_chapters.py --exam "${{ github.event.inputs.exam }}"
          else
            python scripts/build_pyq_chapters.py
          fi
      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pyq-chapters sitemap.xml
          # only the pages this script generates (listed in pyq-chapters/pages.json)
          python - <<'PY' | xargs -r git add -A --
          import json,os
          print('\n'.join(f for f in json.load(open('pyq-chapters/pages.json')) if os.path.exists(f)))
          PY
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "chore: rebuild chapter-wise PYQ tests"
          git pull --rebase origin main || true
          git push
