name: List CA pages

# Rewrites ca-archive/index.json whenever an HTML page is added, renamed or
# removed in ca-archive/. No AI, no API keys — it just lists the files so
# current-affairs.html has a fallback when GitHub's API is rate-limited.

on:
  push:
    paths:
      - 'ca-archive/*.html'
      - 'ca-archive/*.htm'
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write ca-archive/index.json
        run: |
          cd ca-archive
          ls -1 *.html *.htm 2>/dev/null | sort -r | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()], indent=2))' > index.json
          cat index.json

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CA Bot"
          git add ca-archive/index.json
          git diff --staged --quiet || git commit -m "Update CA page list"
          git push
