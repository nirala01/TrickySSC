name: Fetch Current Affairs

# PIB-only daily current affairs → ca-archive/DD-MM-YYYY.html via Gemini Flash.
# Needs one repo secret: GEMINI_API_KEY (Settings → Secrets and variables → Actions).
# Optional repo variable GEMINI_MODEL pins a model (otherwise the newest Flash on the key is used).
# A day that already has a page (e.g. one you wrote by hand) is never overwritten.
#
# TSSC-TELEGRAM-V1: when a NEW day's page is built, its "Today at a glance" lines are also
# posted to the Telegram channel. Needs two more repo secrets, TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID. Without them that step does nothing. A Telegram failure never blocks the page.

on:
  schedule:
    - cron: '30 14 * * *'   # 8:00 PM IST — main run, covers the day's PIB releases
    - cron: '0 17 * * *'    # 10:30 PM IST — backup; skips if the page already exists
  workflow_dispatch:
    inputs:
      date:
        description: 'Date DD-MM-YYYY (blank = today IST). PIB feeds only carry the last day or two.'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the page already exists'
        type: boolean
        required: false
        default: false

concurrency:
  group: fetch-current-affairs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build today's page from PIB with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CA_DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: node fetch-ca.js

      # A page that did not exist before this run shows up as an untracked file.
      # The backup run and forced rebuilds find nothing new, so nothing is posted twice.
      - name: Note whether a new page was built
        id: newpage
        run: |
          f=$(git status --porcelain -- ca-archive/ | grep -E '^\?\? ca-archive/[0-9]{2}-[0-9]{2}-[0-9]{4}\.html$' | head -n 1 | sed 's|^?? ca-archive/||' || true)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "New page: ${f:-none}"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "CA Bot"
          git add ca-archive/ current-affairs.html sitemap.xml
          if git diff --staged --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "🗞️ Daily CA $(TZ=Asia/Kolkata date +'%d %b %Y')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Post the day's digest to Telegram
        if: steps.newpage.outputs.file != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_FILE: ${{ steps.newpage.outputs.file }}
        run: |
          sleep 90          # give GitHub Pages time to publish, so the link in the post opens
          node ca-bot/telegram-post.js digest
