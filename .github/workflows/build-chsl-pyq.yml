# .github/workflows/build-chsl-pyq.yml
#
# Rebuilds the static SSC CHSL PYQ list so newly uploaded papers become
# crawlable HTML links (not just JavaScript-rendered rows).
# Mirrors the existing SSC CGL PYQ build.

name: Build SSC CHSL PYQ page

on:
  schedule:
    - cron: '20 */6 * * *'      # every 6 hours, offset from the CGL build
  workflow_dispatch:            # lets you rebuild by hand right after an upload

permissions:
  contents: write

concurrency:
  group: build-chsl-pyq
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bake the paper list into ssc-chsl-pyq.html
        run: |
          python build_chsl_pyq_page.py \
            --page ssc-chsl-pyq.html \
            --sitemap sitemap-chsl-pyq.xml

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ssc-chsl-pyq.html sitemap-chsl-pyq.xml
          if git diff --cached --quiet; then
            echo "No CHSL paper changes — nothing to commit."
            exit 0
          fi

          # NO [skip ci] HERE. On this repo GitHub Pages publishes via the
          # `pages build and deployment` workflow, and [skip ci] suppresses it —
          # the commit lands on main and the site keeps serving the old file.
          # That is exactly what hid 8 uploaded CHSL papers on 2026-08-20.
          # This workflow only runs on `schedule` and `workflow_dispatch`, never
          # on `push`, so there is no loop to guard against anyway.
          git commit -m "chore: rebuild SSC CHSL PYQ list"

          # Another build workflow may have pushed while this one was running.
          # Rebase and retry rather than failing the run and losing the rebuild.
          for i in 1 2 3; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # The Cloudflare purge step that used to sit here has been removed.
      # trickyssc.com is NOT proxied through Cloudflare (curl -sI returns
      # `Server: GitHub.com`), so there was no cache to purge — and its
      # `if: env.CF_ZONE_ID != ''` condition never saw a job-level env anyway,
      # so it was skipped on every single run. GitHub Pages invalidates its own
      # CDN as part of the deployment.
