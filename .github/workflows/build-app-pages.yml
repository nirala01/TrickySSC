      - 'rrb-ntpc-gk-mock-test.html'
      - 'rrb-ntpc-maths-mock-test.html'
      - 'rrb-ntpc-reasoning-mock-test.html'
      - 'ssc-cgl-computer-mock-test.html'
      - 'ssc-cgl-english-mock-test.html'
      - 'ssc-cgl-gk-mock-test.html'
      - 'ssc-cgl-quant-mock-test.html'
      - 'ssc-cgl-reasoning-mock-test.html'
      - 'ssc-cgl-tier-2-english-mock-test.html'
      - 'ssc-cgl-tier-2-gk-mock-test.html'
      - 'ssc-cgl-tier-2-quant-mock-test.html'
