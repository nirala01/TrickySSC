      - 'ssc-chsl-english-mock-test.html'
      - 'ssc-chsl-gk-mock-test.html'
      - 'ssc-chsl-quant-mock-test.html'
      - 'ssc-chsl-reasoning-mock-test.html'
      - 'ssc-chsl-tier-2-computer-mock-test.html'
      - 'ssc-chsl-tier-2-english-mock-test.html'
      - 'ssc-chsl-tier-2-gk-mock-test.html'
      - 'ssc-chsl-tier-2-quant-mock-test.html'
      - 'ssc-chsl-tier-2-reasoning-mock-test.html'
      - 'ssc-gd-english-mock-test.html'
      - 'ssc-gd-gk-mock-test.html'
      - 'ssc-gd-maths-mock-test.html'
      - 'ssc-gd-reasoning-mock-test.html'
      - 'ssc-mts-english-mock-test.html'
      - 'ssc-mts-gk-mock-test.html'
      - 'ssc-mts-maths-mock-test.html'
