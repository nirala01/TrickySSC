# .github/workflows/build-app-pages.yml
#
# Rebuilds the app-only copies of the list pages (app-<page>.html) from the website
# pages, so the Android app always shows the same mocks and papers as the website
# without anyone editing two files. See build_app_pages.py for what a copy is.
#
# Runs when:
#   - a website list page (or the builder) is pushed by hand
#   - one of the scheduled builders has just rewritten a list page (their commits are
#     made by the Actions bot, which does not fire "push" workflows, hence workflow_run)
#   - you press "Run workflow"

name: Build app pages

on:
  push:
    branches: [main]
    paths:
      - 'build_app_pages.py'
      - 'ssc-cgl-mock-test.html'
      - 'ssc-cgl-tier-2-mock-test.html'
      - 'ssc-chsl-mock-test.html'
