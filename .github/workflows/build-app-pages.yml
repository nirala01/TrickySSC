      - 'ssc-cgl-english-previous-year-questions.html'
      - 'ssc-cgl-gk-previous-year-questions.html'
      - 'ssc-cgl-quant-previous-year-questions.html'
      - 'ssc-cgl-reasoning-previous-year-questions.html'
      - 'ssc-cgl-tier-2-english-previous-year-questions.html'
      - 'ssc-cgl-tier-2-gk-previous-year-questions.html'
      - 'ssc-cgl-tier-2-quant-previous-year-questions.html'
      - 'ssc-cgl-tier-2-reasoning-previous-year-questions.html'
      - 'ssc-chsl-english-previous-year-questions.html'
      - 'ssc-chsl-gk-previous-year-questions.html'
