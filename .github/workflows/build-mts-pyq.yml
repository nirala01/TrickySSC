# .github/workflows/build-mts-pyq.yml
#
# Bakes the SSC MTS previous-year paper list into ssc-mts.html, so the website and the
# Android app read a static list (as they do for CGL, CHSL, GD and NTPC) instead of
# querying Firestore. See build_mts_pyq_page.py.

name: Build SSC MTS PYQ page

on:
  schedule:
    - cron: '20 21 * * 6'      # once a week: Sunday 2:50 AM IST (press Run workflow after an upload)
  workflow_dispatch:            # rebuild by hand right after an upload

permissions:
  contents: write

concurrency:
  group: build-mts-pyq
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bake the paper list into ssc-mts.html
        run: python build_mts_pyq_page.py --page ssc-mts.html

      # TSSC-PYQCOUNTS-V1: recount papers / questions / years from the baked PYQ pages into
      # pyq-counts.json (home page cards, app home, exam hubs). Reads repo files only: no Firestore reads.
      - name: Refresh PYQ counts (pyq-counts.json)
        run: |
          python3 scripts/build_pyq_counts.py
          git add pyq-counts.json

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ssc-mts.html
          if git diff --cached --quiet; then
            echo "No MTS paper changes — nothing to commit."
            exit 0
          fi

          # NO [skip ci] here: GitHub Pages publishes via its own workflow and [skip ci]
          # suppresses it. This workflow never runs on push, so there is no loop.
          git commit -m "chore: rebuild SSC MTS PYQ list"

          for i in 1 2 3; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push after 3 attempts"
          exit 1
