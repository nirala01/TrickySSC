# .github/workflows/build-android.yml
#
# Builds the TrickySSC Android app (android/, package com.trickyssc.app).
#   - Debug APK: always. Install it on a phone to test.
#   - Release AAB (the file Google Play takes): only when the four signing secrets
#     below exist in Settings > Secrets and variables > Actions. Without them the
#     step is skipped and says so.
# Download the files from the run's page, under "Artifacts" (you must be signed in
# to GitHub). Runs when android/ changes, or press "Run workflow".
#
# Secrets (set in GitHub, never in the repo):
#   ANDROID_KEYSTORE_BASE64    the upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Check for signing secrets
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "have=true" >> "$GITHUB_OUTPUT"; else echo "have=false" >> "$GITHUB_OUTPUT"; echo "::notice::No signing secrets set - skipping the signed release AAB."; fi

      - name: Signed release AAB
        if: steps.sign.outputs.have == 'true'
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TSSC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TSSC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TSSC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export TSSC_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle --no-daemon bundleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: trickyssc-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.have == 'true'
        with:
          name: trickyssc-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
