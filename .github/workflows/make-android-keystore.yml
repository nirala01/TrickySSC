# .github/workflows/make-android-keystore.yml
#
# ONE-TIME SETUP. Creates the Android upload keystore for the Play Store and saves
# it, with random passwords, straight into this repo's Actions secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# build-android.yml then signs the release AAB with them.
#
# Before running it, add ONE secret yourself (GitHub > Settings > Secrets and variables
# > Actions > New repository secret):
#   GH_ADMIN_TOKEN = a fine-grained personal access token for this repo only, with
#                    "Secrets: Read and write" (the token is only used to save the secrets).
#
# Nothing secret is printed or uploaded. The keystore cannot be read back from GitHub
# afterwards. If it is ever lost, Google Play can reset the upload key for the app.
# The public certificate fingerprint is printed in the log (safe to share).

name: Make Android keystore (one time)

on:
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace an existing keystore? Leave "no" unless you know you must.'
        default: 'no'

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore and save it to secrets
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "::error::Add the GH_ADMIN_TOKEN secret first (see the top of this workflow file)."; exit 1; fi
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            if [ "$REPLACE" != "yes" ]; then echo "::error::A keystore already exists. Nothing was changed. (Run again with replace = yes only if you must.)"; exit 1; fi
          fi

          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS="$STORE_PASS"
          echo "::add-mask::$STORE_PASS"
          ALIAS=upload

          keytool -genkeypair -v -keystore "$RUNNER_TEMP/upload.jks" -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Tricky SSC, O=Tricky SSC, L=Prayagraj, ST=Uttar Pradesh, C=IN" >/dev/null 2>&1

          B64=$(base64 -w0 "$RUNNER_TEMP/upload.jks")
          echo "::add-mask::$B64"

          gh secret set ANDROID_KEYSTORE_BASE64   --repo "$GITHUB_REPOSITORY" --body "$B64"
          gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$STORE_PASS"
          gh secret set ANDROID_KEY_ALIAS         --repo "$GITHUB_REPOSITORY" --body "$ALIAS"
          gh secret set ANDROID_KEY_PASSWORD      --repo "$GITHUB_REPOSITORY" --body "$KEY_PASS"

          echo "Saved the four Android signing secrets. Public upload-key fingerprint:"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -alias "$ALIAS" -storepass "$STORE_PASS" | grep -E "SHA1|SHA256"
          rm -f "$RUNNER_TEMP/upload.jks"
