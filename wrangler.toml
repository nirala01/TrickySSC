# trickyssc-pay

name = "trickyssc-pay"
main = "src/index.js"
compatibility_date = "2026-08-01"

# No secrets in this file. Set them once each with:
#   wrangler secret put RAZORPAY_KEY_ID
#   wrangler secret put RAZORPAY_KEY_SECRET
#   wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   wrangler secret put FIREBASE_SA_JSON
#
# Secrets are per-environment and are never printed back, so keep your own
# copy of the service-account JSON somewhere safe.
