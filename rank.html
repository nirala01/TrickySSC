<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:#F1F5F9;color:#1E293B;}
  a{color:inherit;}
  .topbar{background:#fff;border-bottom:1px solid #E8EDF3;padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;}
  .brand{font-family:'Rajdhani';font-weight:700;font-size:20px;color:#FF6B00;}
  .back{font-size:13px;font-weight:600;color:#64748B;text-decoration:none;}
  .back:hover{color:#FF6B00;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;}
  .pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .pagehead h1{font-family:'Rajdhani';font-weight:700;font-size:26px;margin:0;}
  select{font-family:'Inter';font-size:13px;font-weight:600;color:#1E293B;background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;padding:9px 12px;max-width:100%;}
  /* hero */
  .hero{background:linear-gradient(135deg,#FFF7ED,#FFFBF5);border:1px solid #FED7AA;border-radius:18px;padding:22px;text-align:center;margin-bottom:18px;box-shadow:0 3px 14px rgba(15,23,42,.05);}
  .hero .rank-num{font-family:'Rajdhani';font-weight:700;font-size:58px;line-height:1;color:#FF6B00;}
  .hero .rank-of{font-size:14px;color:#9A3412;font-weight:600;margin-top:2px;}
  .hero .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .chip{background:#fff;border:1px solid #FDE3CC;border-radius:12px;padding:10px 16px;min-width:96px;}
  .chip .v{font-family:'Rajdhani';font-weight:700;font-size:24px;color:#0F172A;}
  .chip .l{font-size:11px;color:#94A3B8;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .pct-chip{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:#DCFCE7;color:#15803D;font-weight:700;font-size:13px;padding:7px 16px;border-radius:999px;}
  /* table */
  .board{background:#fff;border:1px solid #EDF1F6;border-radius:16px;overflow:hidden;box-shadow:0 3px 14px rgba(15,23,42,.05);}
  .board-head{display:grid;grid-template-columns:64px 1fr 96px 76px;gap:8px;padding:12px 16px;background:#F8FAFC;border-bottom:1px solid #EDF1F6;font-size:11px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.04em;}
  .row{display:grid;grid-template-columns:64px 1fr 96px 76px;gap:8px;padding:13px 16px;border-bottom:1px solid #F1F5F9;align-items:center;font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row .rk{font-family:'Rajdhani';font-weight:700;font-size:17px;color:#475569;}
  .row .nm{font-weight:600;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .mk{font-family:'Rajdhani';font-weight:700;font-size:16px;color:#FF6B00;text-align:right;}
  .row .ac{font-weight:600;color:#64748B;text-align:right;font-size:13px;}
  .row.me{background:#FFF7ED;}
  .row.me .nm{color:#C2410C;}
  .row.me .nm::after{content:' (You)';font-size:11px;font-weight:700;color:#FF6B00;}
  .row.pinned{border-top:2px dashed #FED7AA;background:#FFFBF5;}
  .medal{font-size:18px;}
  .empty{background:#fff;border:1px solid #EDF1F6;border-radius:16px;padding:40px 20px;text-align:center;color:#94A3B8;font-size:14px;}
  .muted{color:#94A3B8;font-size:12.5px;text-align:center;margin-top:14px;}
  .spin{display:inline-block;width:26px;height:26px;border:3px solid #FFE3C9;border-top-color:#FF6B00;border-radius:50%;animation:sp 0.8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  /* Estimated CGL rank card */
  .rank-est{background:#fff;border:1px solid #EDF1F6;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px rgba(15,23,42,.05);}
  .rank-est .ttl{font-family:'Rajdhani';font-weight:700;font-size:18px;margin:0 0 2px;}
  .rank-est .sub{font-size:12px;color:#94A3B8;margin-bottom:16px;}
  .rank-est .grid{display:flex;gap:12px;flex-wrap:wrap;}
  .rank-est .box{flex:1;min-width:140px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:12px;padding:16px;text-align:center;}
  .rank-est .box .v{font-family:'Rajdhani';font-weight:700;font-size:26px;color:#FF6B00;line-height:1.1;}
  .rank-est .box .l{font-size:11px;color:#94A3B8;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:6px;}
  .rank-est .box.chance.good{background:#F0FDF4;border-color:#BBF7D0;}
  .rank-est .box.chance.good .v{color:#15803D;font-size:20px;}
  .rank-est .box.chance.mid{background:#FFFBEB;border-color:#FDE68A;}
  .rank-est .box.chance.mid .v{color:#B45309;font-size:20px;}
  .rank-est .box.chance.low{background:#FEF2F2;border-color:#FECACA;}
  .rank-est .box.chance.low .v{color:#DC2626;font-size:20px;}
  .rank-est details{margin-top:14px;}
  .rank-est summary{cursor:pointer;font-size:13px;font-weight:600;color:#FF6B00;list-style:none;}
  .rank-est summary::-webkit-details-marker{display:none;}
  .rank-est summary::before{content:'\25B8  ';}
  .rank-est details[open] summary::before{content:'\25BE  ';}
  .rank-est ul{margin:10px 0 0;padding-left:18px;font-size:12px;color:#64748B;line-height:1.6;}
  .rank-est li{margin-bottom:6px;}
</style>

<body>
  <div class="topbar">
    <span class="brand">TrickySSC</span>

  <div class="wrap">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, initializeFirestore, collection, doc, getDoc, getDocs, query, where, orderBy, limit, getCountFromServer }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyC4kjEYEZ6Zit9su9V5xpUhMd7vLhE90zA",
  authDomain:"trickyssc-17bb3.firebaseapp.com",
  projectId:"trickyssc-17bb3",
  storageBucket:"trickyssc-17bb3.firebasestorage.app",
  messagingSenderId:"450627057220",
  appId:"1:450627057220:web:366267bf437d94f20c6e11"
});
let db;
try { db = initializeFirestore(app,{experimentalAutoDetectLongPolling:true}); }
catch(_){ db = getFirestore(app); }   // Firestore already initialized elsewhere (e.g. leaderboard.js) — reuse it
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Turn a paperId like "ssc-cgl_2024_tier1_shift-1_2024-09-09_en"
// into a readable name: "SSC CGL Tier 1 · Shift 1 · 09 Sep 2024".
function prettyPaper(id, fallback){
  const raw = String(id||''); if(!raw) return fallback || 'Test';
  const low = raw.toLowerCase();
  let exam='';
  if(/ssc[-_]?cgl/.test(low)) exam='SSC CGL';
  else if(/ssc[-_]?chsl/.test(low)) exam='SSC CHSL';
  else if(/ssc[-_]?cpo/.test(low)) exam='SSC CPO';
  else if(/ssc[-_]?mts/.test(low)) exam='SSC MTS';
  else if(/ssc[-_]?gd/.test(low)) exam='SSC GD';
  else if(/ssc[-_]?je/.test(low)) exam='SSC JE';
  else if(/ssc[-_]?steno/.test(low)) exam='SSC Stenographer';
  else if(/ssc/.test(low)) exam='SSC';
  const tier = low.match(/tier[-_]?(\d)/);
  const shift = low.match(/shift[-_]?(\d)/);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let dateStr=''; const dm = raw.match(/(20\d{2})[-_]?(\d{2})[-_]?(\d{2})/);
  if(dm){ const mo=parseInt(dm[2],10), d=parseInt(dm[3],10);
    if(mo>=1&&mo<=12&&d>=1&&d<=31) dateStr=String(d).padStart(2,'0')+' '+months[mo-1]+' '+dm[1]; }
  let year=''; if(!dateStr){ const ym=raw.match(/(20\d{2})/); if(ym) year=ym[1]; }
  if(!exam) return fallback || raw.replace(/_+/g,' ').replace(/-/g,' ').trim();
  let head=exam; if(tier) head+=' Tier '+tier[1]; if(year) head+=' '+year;
  const parts=[head]; if(shift) parts.push('Shift '+shift[1]); if(dateStr) parts.push(dateStr);
  return parts.join(' · ');
}

// Estimated CGL rank from marks (CGL only). Returns a card HTML string, or ''.
function estimatedRankCard(paperId, marks, maxMarks){
  const low=String(paperId||'').toLowerCase();
  if(!/cgl/.test(low) || isNaN(marks)) return '';        // roadmap is CGL-specific
  const tier=((low.match(/tier[-_]?(\d)/)||[])[1])||'1';
  let base, rankTable, chanceTable, rankLbl, chanceLbl, outside, notes;
  if(tier==='2'){
    base=390; rankLbl='Estimated Final Rank'; chanceLbl='Selection Chance';
    outside='Outside top 35,000';
    rankTable=[[380,'Top 50'],[360,'Top 150'],[350,'Top 400'],[330,'Top 800'],[320,'Top 1,500'],[315,'Top 2,200'],[310,'Top 3,200'],[305,'Top 4,500'],[300,'Top 6,000'],[295,'Top 8,000'],[290,'Top 10,000'],[285,'Top 13,000'],[280,'Top 17,000'],[275,'Top 22,000'],[270,'Top 28,000'],[265,'Top 35,000']];
    chanceTable=[[340,'Very Likely','good'],[330,'Excellent','good'],[320,'Very High','good'],[310,'High','good'],[300,'Good','good'],[290,'Moderate','mid'],[280,'Depends on vacancies','mid'],[0,'Difficult for UR','low']];
    notes=`<li>Your marks are normalized to the standard 390-mark Tier II (Paper I) merit scale, so this is an estimate only.</li>
      <li>Final selection depends on post preference, category, vacancies and qualifying modules (DEST/computer) — not Paper I marks alone.</li>
      <li>"Very likely" posts (ASO MEA, AAO, etc.) typically need 340+; it gets difficult for UR below 280.</li>
      <li><strong>SSC CGL 2025 numbers:</strong>
        <ul style="margin:6px 0 0;padding-left:16px;">
          <li>Applications received: ~28.15 lakh</li>
          <li>Appeared in Tier I: ~18–19 lakh (approx.)</li>
          <li>Qualified for Tier II: 1,39,395</li>
          <li>Finally recommended after Tier II: 15,118</li>
        </ul>
      </li>
      <li>That works out to roughly <strong>7–8%</strong> of Tier I examinees qualifying for Tier II, and about <strong>10.8%</strong> of those who reached Tier II being finally recommended.</li>`;
  } else {
    base=200; rankLbl='Estimated Overall Rank'; chanceLbl='Tier II Chance';
    outside='Outside top 6.5 lakh';
    rankTable=[[195,'Top 50'],[190,'Top 150'],[185,'Top 400'],[180,'Top 800'],[175,'Top 1,500'],[170,'Top 3,000'],[165,'Top 6,000'],[160,'Top 10,000'],[155,'Top 16,000'],[150,'Top 24,000'],[145,'Top 35,000'],[140,'Top 50,000'],[135,'Top 70,000'],[130,'Top 95,000'],[125,'Top 1.25 lakh'],[120,'Top 1.6 lakh'],[115,'Top 2.0 lakh'],[110,'Top 2.5 lakh'],[100,'Top 3.5 lakh'],[90,'Top 5 lakh'],[80,'Top 6.5 lakh']];
    chanceTable=[[175,'Almost certain','good'],[165,'Very High','good'],[155,'High','good'],[145,'Moderate','mid'],[135,'Borderline','mid'],[0,'Difficult for UR','low']];
    notes=`<li>Tier I rank is only an estimate — SSC normalizes scores across multiple shifts, so exact rank can vary.</li>
      <li>Final selection depends on Tier II score, post preference, category, vacancies and qualifying modules — not Tier I rank alone.</li>
      <li><strong>SSC CGL 2025 numbers:</strong>
        <ul style="margin:6px 0 0;padding-left:16px;">
          <li>Applications received: ~28.15 lakh</li>
          <li>Appeared in Tier I: ~18–19 lakh (approx.)</li>
          <li>Qualified for Tier II: 1,39,395</li>
          <li>Finally recommended after Tier II: 15,118</li>
        </ul>
      </li>
      <li>That works out to roughly <strong>7–8%</strong> of Tier I examinees qualifying for Tier II, and about <strong>10.8%</strong> of those who reached Tier II being finally recommended.</li>`;
  }
  let m=marks;
  if(maxMarks&&maxMarks>0&&maxMarks!==base) m=marks/maxMarks*base;
  let rank=outside; for(const r of rankTable){ if(m>=r[0]){ rank=r[1]; break; } }
  let ch='Difficult for UR', cls='low'; for(const c of chanceTable){ if(m>=c[0]){ ch=c[1]; cls=c[2]; break; } }
  return `<div class="rank-est">
    <div class="ttl">📊 Estimated CGL Rank</div>
    <div class="sub">Where these marks place you among all candidates</div>
    <div class="grid">
      <div class="box"><div class="v">${esc(rank)}</div><div class="l">${rankLbl}</div></div>
      <div class="box chance ${cls}"><div class="v">${esc(ch)}</div><div class="l">${chanceLbl}</div></div>
    </div>
    <details><summary>How is this estimated?</summary><ul>${notes}</ul></details>
  </div>`;
}

// Language-agnostic leaderboard key: drop a trailing hi/en/hindi/english token
// so Hindi and English candidates for the same paper share one ranking.
function lbBaseId(id){
  return String(id||'').replace(/([_\-])(hi|en|hindi|english)$/i,'');
}

const params = new URLSearchParams(location.search);
let CURRENT_UID = null;
let CURRENT_PAPER = params.get('paper') || '';

/* TSSC-RANKGATE-V1 — the leaderboard is part of Dashboard Pro (Rs 29). Same gate as
   dashboard.html: allAccess OR modules['ssc-cgl-dashboard'] OR modules['ssc-cgl-mocks'].
   Signed-out or free visitors see the unlock card instead of any rank. */
const RG_ENFORCE=false;   /* PAYWALL SWITCH — false = rank free for everyone (preview). Set true to lock it behind Rs 29. */
const RG_MODULES=['ssc-cgl-dashboard','ssc-cgl-mocks'];
function rgActive(g){ if(!g||g.active!==true) return false; const e=g.expiresAt; if(!e) return true; const ms=e.toDate?e.toDate().getTime():(e.seconds?e.seconds*1000:Date.parse(e)); return !isFinite(ms)||ms>Date.now(); }
async function rgOwned(uid){
  if(!RG_ENFORCE) return true;
  if(!uid) return false;
  try{ const c=JSON.parse(sessionStorage.getItem('tssc_entd_'+uid)||'null'); if(c&&Date.now()-(c.ts||0)<600000) return !!c.owned; }catch(e){}
  try{ const s=await getDoc(doc(db,'entitlements',uid)); const d=s.exists()?(s.data()||{}):{};
    const o=rgActive(d.allAccess)||RG_MODULES.some(k=>rgActive((d.modules||{})[k]));
    try{ sessionStorage.setItem('tssc_entd_'+uid,JSON.stringify({ts:Date.now(),owned:o})); }catch(e){}
    return o; }catch(e){ return false; }
}
function rgLockedCard(signedIn){
  return `<div class="hero" style="text-align:center;">
    <div style="font-size:34px;line-height:1;">&#128274;</div>
    <div style="font-family:'Rajdhani';font-weight:800;font-size:22px;color:#1E293B;margin-top:8px;">Rank &amp; leaderboard are part of Dashboard Pro</div>
    <div style="font-size:13px;color:#64748B;margin:8px auto 14px;max-width:460px;line-height:1.6;">${signedIn?'':'Log in and unlock to see your rank. '}Rank, percentile, cut-off gap, chapter-wise weak areas, time analysis and Error Book &mdash; &#8377;29 for a year. Included free with the &#8377;49 mock series. Your marks and solutions stay free.</div>
    <a href="https://trickyssc.com/dashboard.html#pro" style="display:inline-block;background:linear-gradient(135deg,#FF6B00,#FF8C38);color:#fff;font-family:'Rajdhani';font-weight:700;font-size:16px;padding:12px 26px;border-radius:10px;text-decoration:none;box-shadow:0 4px 16px rgba(255,107,0,.35);">Unlock for &#8377;29 &mdash; click here to know more</a>
  </div>`;
}

onAuthStateChanged(auth, async (user) => {
  CURRENT_UID = user ? user.uid : null;
  CURRENT_PAPER = lbBaseId(CURRENT_PAPER);   // collapse hi/en → one board up front
  if (!(await rgOwned(CURRENT_UID))) {        /* TSSC-RANKGATE-V1 */
    $('content').innerHTML = rgLockedCard(!!user);
    return;
  }
  await buildPaperPicker(user);
  if (CURRENT_PAPER) loadLeaderboard(CURRENT_PAPER);
  else $('content').innerHTML = `<div class="empty">Select a test above to view its leaderboard.</div>`;
});

// Build the paper dropdown from the signed-in user's own attempts (papers they've taken).
async function buildPaperPicker(user){
  const sel = $('paperSelect');
  const seen = new Map(); // base id -> label
  if (CURRENT_PAPER) seen.set(CURRENT_PAPER, prettyPaper(CURRENT_PAPER, params.get('name')));
  if (user) {
    try {
      const qs = await getDocs(query(collection(db,'attempts'), where('uid','==',user.uid), limit(60)));
      qs.forEach(d=>{
        const a=d.data(); const id=lbBaseId(a.paperId||a.mockId);  // one entry per paper, not per language
        if(id && !seen.has(id)) seen.set(id, prettyPaper(id, a.examName||a.exam));
      });
    } catch(_) { /* index may be missing; dropdown just stays minimal */ }
  }
  if (seen.size === 0) { sel.style.display='none'; return; }
  sel.innerHTML = [...seen.entries()].map(([id,label]) =>
    `<option value="${esc(id)}" ${id===CURRENT_PAPER?'selected':''}>${esc(label)}</option>`).join('');
  sel.style.display='inline-block';
  if (!CURRENT_PAPER) { CURRENT_PAPER = sel.value; }
}

window.onPaperChange = function(){
  CURRENT_PAPER = lbBaseId($('paperSelect').value);
  history.replaceState(null,'', 'rank.html?paper='+encodeURIComponent(CURRENT_PAPER));
  loadLeaderboard(CURRENT_PAPER);
};

async function loadLeaderboard(rawPaper){
  const paperId = lbBaseId(rawPaper);          // language-agnostic board key
  CURRENT_PAPER = paperId;
  const bn=$('boardName'); if(bn) bn.textContent=prettyPaper(paperId);
  $('content').innerHTML = `<div class="empty"><div class="spin"></div><div style="margin-top:12px;">Loading leaderboard…</div></div>`;
  $('footNote').textContent = '';

  // Read the merged board (base) plus any legacy language-suffixed boards, so
  // scores written before the merge still count. New scores all land on `base`.
  const variants = [...new Set([paperId, paperId+'_hi', paperId+'_en'])];
  const scoresColOf = v => collection(db,'leaderboards',v,'scores');

  let rows = [], anyOk=false, anyIndexErr=false;
  for (const v of variants){
    try {
      const qs = await getDocs(query(scoresColOf(v), orderBy('marks','desc'), limit(100)));
      qs.forEach(d => rows.push(d.data()));
      anyOk = true;
    } catch (e) {
      const msg = String(e.message||e).toLowerCase();
      if (msg.includes('index') || msg.includes('failed-precondition')) anyIndexErr = true;
      // otherwise: variant collection simply doesn't exist — ignore
    }
  }

  if (!anyOk && anyIndexErr) {
    $('content').innerHTML = `<div class="empty">⚙️ <b>Index still building</b><br><span style="font-size:12px;">This usually takes 1–2 minutes on first use. Please wait and refresh.</span></div>`;
    return;
  }

  // Dedupe by uid — a candidate who attempted both languages is ranked once, by best marks
  const byUid = new Map();
  rows.forEach(r => {
    const k = r.uid || ('anon_'+Math.random());
    const cur = byUid.get(k);
    if (!cur || (Number(r.marks)||0) > (Number(cur.marks)||0)) byUid.set(k, r);
  });
  rows = [...byUid.values()].sort((a,b) => {
    if ((Number(b.marks)||0) !== (Number(a.marks)||0)) return (Number(b.marks)||0) - (Number(a.marks)||0);
    const ta = a.submittedAt?.toDate ? a.submittedAt.toDate().getTime() : 0;
    const tb = b.submittedAt?.toDate ? b.submittedAt.toDate().getTime() : 0;
    return ta - tb;
  }).slice(0, 100);

  if (rows.length === 0) {
    $('content').innerHTML = `<div class="empty">No scores yet for this test.<br>Be the first to attempt it! 🚀</div>`;
    return;
  }

  // Total participants — summed across variants (server-side counts)
  let total = 0, gotCount = false;
  for (const v of variants){
    try { total += (await getCountFromServer(scoresColOf(v))).data().count; gotCount = true; } catch(_){}
  }
  if (!gotCount) total = rows.length;

  // Current user's standing — best score across variants
  let myRow = null, myRank = null;
  const idxTop = rows.findIndex(r => r.uid === CURRENT_UID);
  if (CURRENT_UID) {
    if (idxTop >= 0) { myRow = rows[idxTop]; myRank = idxTop + 1; }
    else {
      for (const v of variants){
        try {
          const me = await getDoc(doc(db,'leaderboards',v,'scores',CURRENT_UID));
          if (me.exists()) { const d=me.data(); if(!myRow || (Number(d.marks)||0)>(Number(myRow.marks)||0)) myRow=d; }
        } catch(_){}
      }
      if (myRow) {
        let ahead = 0;
        for (const v of variants){
          try { ahead += (await getCountFromServer(query(scoresColOf(v), where('marks','>', Number(myRow.marks)||0)))).data().count; } catch(_){}
        }
        myRank = ahead + 1;
      }
    }
  }

  const maxMarks = rows[0].maxMarks || (myRow && myRow.maxMarks) || 0;
  renderHero(myRow, myRank, total, maxMarks);
  renderTable(rows, myRow, myRank, total);
  $('footNote').textContent = 'Showing top ' + Math.min(100, rows.length) + ' of ' + total + ' candidate' + (total===1?'':'s') + ' · Hindi + English combined. Best attempt per candidate is ranked.';
}

function renderHero(myRow, myRank, total, maxMarks){
  let html;
  if (!CURRENT_UID) {
    html = `<div class="hero"><div style="font-size:15px;color:#9A3412;font-weight:600;">Log in to see your rank on this test.</div></div>`;
  } else if (!myRow) {
    html = `<div class="hero"><div style="font-size:15px;color:#9A3412;font-weight:600;">You haven't attempted this test yet.</div>
      <div style="font-size:13px;color:#B45309;margin-top:6px;">Attempt it to claim your spot on the board!</div></div>`;
  } else {
    const topPct = Math.max(1, Math.round((myRank/total)*100));
    const mk = (Number(myRow.marks)||0);
    const acc = (myRow.accuracy!=null) ? Math.round(myRow.accuracy)+'%' : '—';
    html = `<div class="hero">
      <div class="rank-num">#${myRank}</div>
      <div class="rank-of">out of ${total} candidate${total===1?'':'s'}</div>
      <div class="chips">
        <div class="chip"><div class="v">${mk}${maxMarks?'<span style="font-size:14px;color:#94A3B8;">/'+maxMarks+'</span>':''}</div><div class="l">Marks</div></div>
        <div class="chip"><div class="v">${acc}</div><div class="l">Accuracy</div></div>
      </div>
      <div class="pct-chip">⭐ You're in the Top ${topPct}%</div>
    </div>`;
  }
  const estCard = (CURRENT_UID && myRow) ? estimatedRankCard(CURRENT_PAPER, Number(myRow.marks)||0, maxMarks) : '';
  $('content').innerHTML = html + estCard + `<div id="boardSlot"></div>`;
}

function renderTable(rows, myRow, myRank, total){
  const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
  let body = rows.map((r,i) => {
    const me = (r.uid === CURRENT_UID);
    const mk = (Number(r.marks)||0);
    const mx = r.maxMarks ? '<span style="font-size:12px;color:#CBD5E1;">/'+r.maxMarks+'</span>' : '';
    const acc = (r.accuracy!=null) ? Math.round(r.accuracy)+'%' : '—';
    const md = medal(i);
    return `<div class="row ${me?'me':''}">
      <div class="rk">${md?'<span class="medal">'+md+'</span>':('#'+(i+1))}</div>
      <div class="nm">${esc(r.name||'Student')}</div>
      <div class="mk">${mk}${mx}</div>
      <div class="ac">${acc}</div>
    </div>`;
  }).join('');

  // Pin the user's own row at the bottom if they're outside the visible top list
  if (CURRENT_UID && myRow && myRank && myRank > rows.length) {
    const mk = (Number(myRow.marks)||0);
    const mx = myRow.maxMarks ? '<span style="font-size:12px;color:#CBD5E1;">/'+myRow.maxMarks+'</span>' : '';
    const acc = (myRow.accuracy!=null) ? Math.round(myRow.accuracy)+'%' : '—';
    body += `<div class="row me pinned">
      <div class="rk">#${myRank}</div>
      <div class="nm">${esc(myRow.name||'Student')}</div>
      <div class="mk">${mk}${mx}</div>
      <div class="ac">${acc}</div>
    </div>`;
  }

  $('boardSlot').innerHTML = `<div class="board">
    <div class="board-head"><div>Rank</div><div>Candidate</div><div style="text-align:right;">Marks</div><div style="text-align:right;">Acc.</div></div>
    ${body}
  </div>`;
}
</script>
</body>
</html>
