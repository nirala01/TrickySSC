<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Challenge registrations — TrickySSC Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- TSSC-AIC-ADMIN-V1 (2026-11-21): who has registered for the All India Challenge Mocks.
     TSSC-AIC-ADMIN-V2 (2026-11-26): Sort by rank in any opened paper; click a paper under "Papers taken" for marks and rank.
     TSSC-AIC-ADMIN-V3 (2026-11-27): "Ratings & feedback" tab — who gave how many stars to which paper, with their other answers
     (level felt, hardest part, time, wrong question, note). Read from mock_ratings for the opened papers' test ids only.
     Read only, no new Firestore rules. A registration is users/{uid}.aic (SSC CGL Tier 2) or
     users/{uid}.aicChsl (SSC CHSL Tier 1), with a mirror row on leaderboards/aic-registered and
     leaderboards/aic-chsl-registered. This page reads the user records (name, email, mobile) the
     same way admin-testers.html reads app users, and falls back to the mirror rows (names only)
     for anyone whose record could not be read. Who took a paper comes from the round's own board
     leaderboards/<exam>_aic_mockN. Dates and rounds are worked out exactly as in /tssc-aic.js. -->
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:#F1F5F9;color:#1E293B;}
  .topbar{background:#fff;border-bottom:1px solid #E8EDF3;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  .brand{font-family:'Rajdhani';font-weight:700;font-size:20px;color:#FF6B00;}
  .brand small{color:#64748B;font-size:14px;margin-left:6px;}
  .nav a{font-size:12px;font-weight:700;color:#475569;text-decoration:none;padding:6px 10px;border-radius:8px;background:#F1F5F9;margin-right:4px;}
  .who{margin-left:auto;font-size:12px;color:#64748B;}
  .btn{font-size:13px;font-weight:700;padding:9px 14px;border-radius:9px;border:0;cursor:pointer;}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-orange{background:#FF6B00;color:#fff;}
  .btn-ghost{background:#F1F5F9;color:#475569;border:1.5px solid #E2E8F0;}
  .wrap{max-width:1150px;margin:0 auto;padding:16px 14px 70px;}
  .card{background:#fff;border:1px solid #EDF1F6;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 14px rgba(15,23,42,.05);}
  .empty{text-align:center;color:#64748B;padding:36px 10px;}
  .hidden{display:none !important;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
  .stat{background:#fff;border:1px solid #EDF1F6;border-radius:12px;padding:12px 14px;cursor:pointer;}
  .stat:hover{border-color:#FF6B00;} .stat.on{border-color:#FF6B00;box-shadow:0 0 0 2px #FFE1CC;}
  .stat b{display:block;font-family:'Rajdhani';font-size:28px;line-height:1;}
  .stat span{font-size:12px;color:#64748B;font-weight:600;}
  .next{font-size:13.5px;line-height:1.6;color:#334155;}
  .next b{color:#1E293B;}
  input.filter{width:100%;font-size:14px;padding:10px 12px;border-radius:10px;border:1.5px solid #E2E8F0;margin-bottom:10px;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:#475569;}
  .tw{overflow-x:auto;background:#fff;border:1px solid #EDF1F6;border-radius:14px;}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:860px;}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #F1F5F9;vertical-align:top;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748B;background:#F8FAFC;white-space:nowrap;}
  td .em{font-size:12px;color:#64748B;word-break:break-all;}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:800;white-space:nowrap;margin:0 3px 3px 0;}
  .p-chsl{background:#FFEDD5;color:#C2410C;} .p-cgl{background:#E0E7FF;color:#4338CA;}
  .p-done{background:#DCFCE7;color:#15803D;} .p-app{background:#F1F5F9;color:#475569;}
  .say{font-size:13px;color:#64748B;margin:6px 0;} .say.err{color:#DC2626;font-weight:600;}
  a.wa{color:#16A34A;font-weight:700;text-decoration:none;font-size:12px;}
  /* TSSC-AIC-ADMIN-V2: rank sort + marks and rank per paper */
  select.sort{font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px;border:1.5px solid #E2E8F0;background:#fff;color:#1E293B;max-width:100%;}
  button.pill{border:0;cursor:pointer;font-family:inherit;}
  button.pill:hover,button.pill.on{background:#15803D;color:#fff;}
  .rk{font-family:'Rajdhani';font-weight:700;font-size:16px;color:#FF6B00;}
  tr.det td{background:#F8FAFC;padding:12px 14px;}
  .dbox{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 6px;}
  .dbox div{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:8px 12px;min-width:104px;}
  .dbox b{display:block;font-family:'Rajdhani';font-size:21px;line-height:1.1;color:#1E293B;}
  .dbox span{font-size:11px;color:#64748B;font-weight:600;}
  .dsec{font-size:12.5px;color:#475569;line-height:1.7;}
  .dsec a{color:#FF6B00;font-weight:700;text-decoration:none;}
  /* TSSC-AIC-ADMIN-V3: ratings and feedback */
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .tabs button{font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;border:1.5px solid #E2E8F0;background:#fff;color:#475569;cursor:pointer;}
  .tabs button.on{background:#1E293B;border-color:#1E293B;color:#fff;}
  .stars{color:#F59E0B;font-size:15px;letter-spacing:1px;white-space:nowrap;} .stars i{color:#CBD5E1;font-style:normal;}
  .fbsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-bottom:12px;}
  .fbsum .card{margin:0;font-size:13px;line-height:1.7;color:#334155;}
  .fbsum .big{font-family:'Rajdhani';font-weight:700;font-size:26px;color:#1E293B;line-height:1;}
  .fbnote{max-width:260px;white-space:normal;word-break:break-word;}
  .dfb{margin-top:8px;padding-top:8px;border-top:1px dashed #CBD5E1;font-size:12.5px;color:#334155;line-height:1.7;}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">TrickySSC <small>Challenge registrations</small></span>
  <span class="nav"><a href="/admin.html">Admin home</a><a href="/admin-premium.html">Premium</a><a href="/admin-testers.html">App testers</a></span>
  <span class="who" id="who"></span>
  <button class="btn btn-ghost hidden" id="so">Sign out</button>
</div>
<div class="wrap">
  <div class="card empty" id="gate">Checking sign-in…</div>
  <div id="main" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="card next" id="next"></div>
    <div class="tabs"><button id="tabStu" class="on">Students</button><button id="tabFb">Ratings &amp; feedback</button></div>
    <input class="filter" id="q" placeholder="Search name, email or mobile">
    <div id="viewStu">
    <div class="bar">
      <span id="count"></span>
      <span style="flex:1"></span>
      <label for="sort" style="font-weight:600;">Sort by</label>
      <select class="sort" id="sort"><option value="reg">Newest registration</option></select>
      <button class="btn btn-ghost" id="reload">Refresh</button>
      <button class="btn btn-orange" id="csv">Download CSV</button>
    </div>
    <div class="say" id="say"></div>
    <div class="tw"><table><thead><tr><th id="headNo">#</th><th>Student</th><th>Mobile</th><th>Registered for</th><th>Registered on</th><th>First paper</th><th>Papers taken <span style="text-transform:none;letter-spacing:0;font-weight:500;">(click for marks and rank)</span></th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <div id="viewFb" class="hidden">
      <div class="fbsum" id="fbsum"></div>
      <div class="bar">
        <span id="fbcount"></span>
        <span style="flex:1"></span>
        <select class="sort" id="fbpaper"></select>
        <select class="sort" id="fbstar"><option value="">All stars</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option><option value="low">3 stars or less</option><option value="text">With a written note</option></select>
        <select class="sort" id="fbsort"><option value="new">Newest first</option><option value="lo">Lowest stars first</option><option value="hi">Highest stars first</option></select>
        <button class="btn btn-orange" id="fbcsv">Download CSV</button>
      </div>
      <div class="tw"><table><thead><tr><th>#</th><th>Student</th><th>Paper</th><th>Stars</th><th>Level felt</th><th>Hardest part</th><th>Time was short in</th><th>Wrong question reported</th><th>Other note</th><th>Marks · rank</th><th>Given on</th></tr></thead><tbody id="fbrows"></tbody></table></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyC4kjEYEZ6Zit9su9V5xpUhMd7vLhE90zA",
  authDomain:"trickyssc-17bb3.firebaseapp.com",
  projectId:"trickyssc-17bb3",
  storageBucket:"trickyssc-17bb3.firebasestorage.app",
  messagingSenderId:"450627057220",
  appId:"1:450627057220:web:366267bf437d94f20c6e11"
});
const auth = getAuth(app), db = getFirestore(app);
const ADMINS = ['nirala01@gmail.com','ashish@trickyssc.com'];
const isAdmin = e => !!e && (ADMINS.includes(e) || /@trickyssc\.com$/.test(e));

/* the two series — the same dates as /tssc-aic.js */
const H = 3600000;
const SER = {
  chsl: { key:'chsl', name:'CHSL Tier 1', field:'aicChsl', board:'aic-chsl-registered', exam:'ssc-chsl', first:Date.UTC(2026,10,28,3,30), last:5 },
  cgl:  { key:'cgl',  name:'CGL Tier 2',  field:'aic',     board:'aic-registered',      exam:'ssc-cgl',  first:Date.UTC(2026,10,29,3,30), last:0 }
};
const WEEK = 7*24*H;
const startOf = (s,n) => s.first + (n-1)*WEEK;
const hasRound = (s,n) => n>=1 && (!s.last || n<=s.last);
/* the first round a registration made at time t counts for (registration closes 9 h before the paper opens) */
function firstRound(s,t){ let n=1; while(hasRound(s,n) && t >= startOf(s,n)-9*H) n++; return hasRound(s,n) ? n : 0; }
/* rounds whose paper has opened by now */
function openedRounds(s){ const out=[]; for(let n=1; hasRound(s,n) && Date.now()>=startOf(s,n) && n<=60; n++) out.push(n); return out; }

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden'), hide = id => $(id).classList.add('hidden');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tsMs = v => !v ? 0 : (v.toMillis ? v.toMillis() : (v.seconds ? v.seconds*1000 : (Date.parse(v)||0)));
const IST = { timeZone:'Asia/Kolkata' };
const fmtWhen = ms => ms ? new Date(ms).toLocaleString('en-IN', Object.assign({ day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true }, IST)) : '';
const fmtDay = ms => new Date(ms).toLocaleDateString('en-IN', Object.assign({ weekday:'short', day:'numeric', month:'short' }, IST));
function say(t, cls){ $('say').textContent = t||''; $('say').className = 'say'+(cls?' '+cls:''); }

let ROWS = [], FILTER = 'all', TAKEN = {};   // TAKEN: 'chsl:1' -> Map(uid -> score row with .rank and .total)
let FB = {}, VIEW = 'stu';                   // FB: 'chsl:1' -> Map(uid -> the rating and questionnaire answers that student gave)
const starHtml = n => { n = Math.max(0, Math.min(5, Math.round(Number(n) || 0))); return '<span class="stars">' + '★'.repeat(n) + '<i>' + '★'.repeat(5 - n) + '</i></span>'; };
const fbOf = (uid, x) => FB[x] ? FB[x].get(uid) : null;
const timeTxt = f => (Array.isArray(f.timeShort) ? f.timeShort : (f.timeShort ? [f.timeShort] : [])).join(', ');
let SORT = 'reg', OPEN = '';                 // SORT: 'reg' or a paper key 'chsl:1' · OPEN: 'uid|chsl:1' = the detail row shown
const paperName = x => { const p = x.split(':'); return SER[p[0]].name + ' Mock ' + p[1]; };
const num = v => { const n = Number(v) || 0; return String(Math.round(n * 100) / 100); };
const fmtDur = sec => { sec = Math.round(Number(sec) || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = sec % 60; return (h ? h + ' h ' : '') + m + ' min ' + s2 + ' s'; };

onAuthStateChanged(auth, async user => {
  if (!user) {
    $('gate').innerHTML = '<p>Sign in with the admin Google account.</p><button class="btn btn-orange" id="si">Sign in with Google</button>';
    $('si').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { $('gate').insertAdjacentHTML('beforeend', '<p class="say err">' + esc(e.message) + '</p>'); });
    show('gate'); hide('main'); hide('so'); return;
  }
  if (!isAdmin(user.email)) { $('gate').textContent = user.email + ' is not an admin account.'; await signOut(auth); return; }
  $('who').textContent = user.email; show('so');
  $('gate').textContent = 'Loading…'; show('gate');
  await load();
  hide('gate'); show('main');
});
$('so').onclick = () => signOut(auth);
$('reload').onclick = async () => { $('reload').disabled = true; await load(); $('reload').disabled = false; };
$('q').oninput = paint;
$('sort').onchange = () => { SORT = $('sort').value; OPEN = ''; paint(); };
$('q').addEventListener('input', () => paintFb());
function setView(v) { VIEW = v; $('tabStu').classList.toggle('on', v === 'stu'); $('tabFb').classList.toggle('on', v === 'fb'); $('viewStu').classList.toggle('hidden', v !== 'stu'); $('viewFb').classList.toggle('hidden', v !== 'fb'); }
$('tabStu').onclick = () => setView('stu'); $('tabFb').onclick = () => { setView('fb'); paintFb(); };
['fbpaper', 'fbstar', 'fbsort'].forEach(id => $(id).onchange = () => paintFb());

async function load() {
  say('Loading…');
  const by = {};   // uid -> row
  const row = uid => by[uid] || (by[uid] = { uid, name:'', email:'', mobile:'', reg:{}, src:{}, full:false });
  const problems = [];
  for (const k of Object.keys(SER)) {
    const s = SER[k];
    /* 1. the student records (name, email, mobile) */
    try {
      (await getDocs(query(collection(db, 'users'), where(s.field + '.reg', '==', true)))).forEach(d => {
        const u = d.data() || {}, r = row(d.id), a = u[s.field] || {};
        r.name = String(u.name || u.displayName || r.name || '').trim(); r.email = String(u.email || r.email || '').trim();
        r.mobile = String(u.phone || u.mobile || r.mobile || '').trim(); r.full = true;
        r.reg[k] = tsMs(a.at) || r.reg[k] || 0; r.src[k] = a.src || '';
      });
    } catch (e) { problems.push(s.name + ' student records: ' + (e.code || e.message)); }
    /* 2. the mirror rows: anyone missing above still shows, by name */
    try {
      (await getDocs(collection(db, 'leaderboards', s.board, 'scores'))).forEach(d => {
        const x = d.data() || {}, r = row(d.id);
        if (!r.name) r.name = String(x.name || '').trim();
        if (!r.reg[k]) r.reg[k] = tsMs(x.submittedAt) || 1;
      });
    } catch (e) { problems.push(s.name + ' registration board: ' + (e.code || e.message)); }
    /* 3. who has taken each paper that has opened */
    for (const n of openedRounds(s)) {
      try {
        const list = [];
        (await getDocs(collection(db, 'leaderboards', s.exam + '_aic_mock' + n, 'scores'))).forEach(d => { const x = d.data() || {}; x.uid = d.id; x.marks = Number(x.marks) || 0; list.push(x); });
        list.sort((a, b) => b.marks - a.marks);
        const map = new Map();
        list.forEach((x, i) => { x.rank = (i && list[i-1].marks === x.marks) ? list[i-1].rank : i + 1; x.total = list.length; map.set(x.uid, x); });
        TAKEN[k + ':' + n] = map;
        /* the star rating + questionnaire of this paper: mock_ratings rows of its English and Hindi test ids only */
        try {
          const fm = new Map(), base = s.exam + '_aic_mock' + n;
          (await getDocs(query(collection(db, 'mock_ratings'), where('mockId', 'in', [base + '_en', base + '_hi', base])))).forEach(d => {
            const x = d.data() || {}; if (!x.uid || !(Number(x.stars) > 0)) return;
            x.at = tsMs(x.createdAt); x.lang = /_hi$/.test(String(x.mockId)) ? 'Hindi' : 'English';
            const old = fm.get(x.uid); if (!old || x.at >= old.at) fm.set(x.uid, x);
          });
          FB[k + ':' + n] = fm;
        } catch (e) { problems.push(s.name + ' Mock ' + n + ' ratings: ' + (e.code || e.message)); }
      } catch (e) { problems.push(s.name + ' Mock ' + n + ' board: ' + (e.code || e.message)); }
    }
  }
  ROWS = Object.values(by).sort((a, b) => Math.max(b.reg.chsl||0, b.reg.cgl||0) - Math.max(a.reg.chsl||0, a.reg.cgl||0));
  say(problems.length ? 'Some data could not be read: ' + problems.join(' · ') : '', problems.length ? 'err' : '');
  /* the Sort by list: one entry per paper that has opened */
  const keys = Object.keys(TAKEN).sort((a, b) => a.split(':')[0].localeCompare(b.split(':')[0]) * -1 || (a.split(':')[1] - b.split(':')[1]));
  if (SORT !== 'reg' && !TAKEN[SORT]) SORT = 'reg';
  $('sort').innerHTML = '<option value="reg">Newest registration</option>'
    + keys.map(x => '<option value="' + x + '">Rank in ' + esc(paperName(x)) + ' (' + TAKEN[x].size + ' took it)</option>').join('')
    + (keys.length ? '' : '<option disabled>Rank options appear when a paper opens</option>');
  $('sort').value = SORT;
  const fp = $('fbpaper').value;
  $('fbpaper').innerHTML = '<option value="">All papers</option>' + keys.map(x => '<option value="' + x + '">' + esc(paperName(x)) + '</option>').join('');
  $('fbpaper').value = keys.includes(fp) ? fp : '';
  const nfb = Object.keys(FB).reduce((t, x) => t + FB[x].size, 0);
  $('tabFb').textContent = 'Ratings & feedback (' + nfb + ')';
  paintStats(); paintNext(); paint(); paintFb();
}

function paintStats() {
  const c = k => ROWS.filter(r => r.reg[k]).length;
  const both = ROWS.filter(r => r.reg.chsl && r.reg.cgl).length;
  const day = new Date(Date.now()+19800000).toISOString().slice(0,10);
  const today = ROWS.filter(r => ['chsl','cgl'].some(k => r.reg[k] > 1 && new Date(r.reg[k]+19800000).toISOString().slice(0,10) === day)).length;
  const cells = [['all', ROWS.length, 'All registered students'], ['chsl', c('chsl'), 'CHSL Tier 1'], ['cgl', c('cgl'), 'CGL Tier 2'], ['both', both, 'Registered for both'], ['today', today, 'Registered today']];
  $('stats').innerHTML = cells.map(x => '<div class="stat' + (FILTER===x[0]?' on':'') + '" data-f="' + x[0] + '"><b>' + x[1] + '</b><span>' + x[2] + '</span></div>').join('');
  $('stats').querySelectorAll('.stat').forEach(el => el.onclick = () => { FILTER = el.dataset.f; paintStats(); paint(); });
}

/* how many are in for the next paper of each series */
function paintNext() {
  const lines = [];
  for (const k of Object.keys(SER)) {
    const s = SER[k]; let n = 1; while (hasRound(s, n) && Date.now() >= startOf(s, n) + 15*H) n++;
    if (!hasRound(s, n)) { lines.push('<b>' + s.name + ':</b> the series is over.'); continue; }
    const close = startOf(s, n) - 9*H;
    const inTime = ROWS.filter(r => r.reg[k] && r.reg[k] < close).length;
    const late = ROWS.filter(r => r.reg[k] && r.reg[k] >= close).length;
    const taken = TAKEN[k + ':' + n] ? TAKEN[k + ':' + n].size : 0;
    lines.push('<b>' + s.name + ' · Challenge Mock ' + n + '</b> on ' + fmtDay(startOf(s, n)) + ': <b>' + inTime + '</b> student' + (inTime===1?'':'s') + ' can take it'
      + (late ? ' (' + late + ' more registered after the closing time and start from the next paper)' : '')
      + (Date.now() >= startOf(s, n) ? ' · <b>' + taken + '</b> have submitted so far' : ' · registration closes ' + fmtWhen(close - 60000)) + '.');
  }
  $('next').innerHTML = lines.join('<br>');
}

function visible() {
  const q = $('q').value.trim().toLowerCase();
  const day = new Date(Date.now()+19800000).toISOString().slice(0,10);
  const out = ROWS.filter(r => {
    if (FILTER==='chsl' && !r.reg.chsl) return false;
    if (FILTER==='cgl' && !r.reg.cgl) return false;
    if (FILTER==='both' && !(r.reg.chsl && r.reg.cgl)) return false;
    if (FILTER==='today' && !['chsl','cgl'].some(k => r.reg[k] > 1 && new Date(r.reg[k]+19800000).toISOString().slice(0,10) === day)) return false;
    return !q || (r.name + ' ' + r.email + ' ' + r.mobile).toLowerCase().includes(q);
  });
  /* by rank in one paper: best rank first, students who did not take that paper after them */
  const B = SORT !== 'reg' && TAKEN[SORT];
  if (B) out.sort((a, b) => { const x = B.get(a.uid), y = B.get(b.uid); return (x ? x.rank : 1e9) - (y ? y.rank : 1e9) || ((x && y) ? (x.timeUsed || 0) - (y.timeUsed || 0) : 0); });
  return out;
}
const takenKeys = r => Object.keys(TAKEN).filter(x => TAKEN[x].has(r.uid));
const takenList = r => takenKeys(r).map(x => { const d = TAKEN[x].get(r.uid); return paperName(x) + ': ' + num(d.marks) + (d.maxMarks ? '/' + num(d.maxMarks) : '') + ' marks, rank ' + d.rank + ' of ' + d.total; });

/* the marks and rank panel under a student, for one paper */
function detailRow(r, x) {
  const d = TAKEN[x].get(r.uid), p = x.split(':'), s = SER[p[0]], f = fbOf(r.uid, x);
  const pct = d.total > 1 ? Math.round((d.total - d.rank) / (d.total - 1) * 1000) / 10 : 100;
  const box = (v, l) => '<div><b>' + v + '</b><span>' + l + '</span></div>';
  const sm = d.subjectMarks && typeof d.subjectMarks === 'object' ? Object.keys(d.subjectMarks) : [];
  const at = tsMs(d.submittedAt);
  return '<tr class="det"><td></td><td colspan="6"><b>' + esc(r.name || d.name || 'Student') + ' · ' + esc(paperName(x)) + '</b>'
    + '<div class="dbox">' + box(num(d.marks) + (d.maxMarks ? ' / ' + num(d.maxMarks) : ''), 'Marks')
    + box(d.rank + ' / ' + d.total, 'All India rank') + box(pct + '%', 'Percentile')
    + (d.accuracy != null ? box(num(d.accuracy) + '%', 'Accuracy') : '')
    + (d.timeUsed != null ? box(fmtDur(d.timeUsed), 'Time used') : '') + '</div>'
    + '<div class="dsec">' + (sm.length ? 'Section marks: ' + sm.map(k => esc(k) + ' <b>' + num(d.subjectMarks[k]) + '</b>').join(' · ') + '<br>' : '')
    + (at ? 'Submitted ' + fmtWhen(at) + ' · ' : '')
    + '<a target="_blank" rel="noopener" href="/rank.html?paper=' + encodeURIComponent(s.exam + '_aic_mock' + p[1]) + '&name=' + encodeURIComponent('SSC ' + s.name + ' All India Challenge Mock ' + p[1]) + '">Full leaderboard →</a></div>'
    + (f ? '<div class="dfb"><b>Their rating:</b> ' + starHtml(f.stars) + (f.difficulty ? ' · Level felt: <b>' + esc(f.difficulty) + '</b>' : '')
        + (f.hardPart ? ' · Hardest part: <b>' + esc(f.hardPart) + '</b>' : '') + (timeTxt(f) ? ' · Time was short in: <b>' + esc(timeTxt(f)) + '</b>' : '')
        + (f.issue ? '<br>Wrong question reported: ' + esc(f.issue) : '') + (f.comment ? '<br>Other note: ' + esc(f.comment) : '') + '</div>'
      : '<div class="dfb" style="color:#64748B;">No rating given for this paper.</div>')
    + '</td></tr>';
}

/* ---- Ratings & feedback: who gave how many stars, and what else they said ---- */
function fbList() {
  const q = $('q').value.trim().toLowerCase(), pap = $('fbpaper').value, st = $('fbstar').value, so = $('fbsort').value;
  const who = {}; ROWS.forEach(r => who[r.uid] = r);
  let out = [];
  Object.keys(FB).forEach(x => { if (pap && pap !== x) return; FB[x].forEach((f, uid) => {
    const r = who[uid] || {}; out.push({ x, uid, f, name: r.name || f.name || 'Student', email: r.email || '', mobile: r.mobile || '', sc: TAKEN[x] ? TAKEN[x].get(uid) : null });
  }); });
  out = out.filter(o => {
    const n = Number(o.f.stars) || 0;
    if (st === 'low' && n > 3) return false;
    if (st === 'text' && !(o.f.issue || o.f.comment)) return false;
    if (/^[1-5]$/.test(st) && n !== Number(st)) return false;
    return !q || (o.name + ' ' + o.email + ' ' + o.mobile + ' ' + (o.f.issue || '') + ' ' + (o.f.comment || '')).toLowerCase().includes(q);
  });
  out.sort((a, b) => so === 'lo' ? (a.f.stars - b.f.stars) || (b.f.at - a.f.at) : so === 'hi' ? (b.f.stars - a.f.stars) || (b.f.at - a.f.at) : b.f.at - a.f.at);
  return out;
}
function paintFb() {
  const keys = Object.keys(FB);
  /* one summary card per paper: average, how many gave each star, the common answers */
  const tally = (list, get) => { const m = {}; list.forEach(f => [].concat(get(f) || []).forEach(v => { if (v) m[v] = (m[v] || 0) + 1; })); return Object.keys(m).sort((a, b) => m[b] - m[a]).map(v => esc(v) + ' <b>' + m[v] + '</b>').join(' · '); };
  $('fbsum').innerHTML = keys.filter(x => FB[x].size).map(x => {
    const list = [...FB[x].values()], n = list.length, avg = list.reduce((t, f) => t + (Number(f.stars) || 0), 0) / n;
    const took = TAKEN[x] ? TAKEN[x].size : 0;
    return '<div class="card"><b>' + esc(paperName(x)) + '</b><br><span class="big">' + (Math.round(avg * 10) / 10) + '</span> / 5 ' + starHtml(avg) + ' · ' + n + ' rating' + (n === 1 ? '' : 's') + (took ? ' from ' + took + ' who took it' : '')
      + '<br>' + [5, 4, 3, 2, 1].map(k => k + '★ <b>' + list.filter(f => Math.round(f.stars) === k).length + '</b>').join(' · ')
      + (tally(list, f => f.difficulty) ? '<br>Level felt: ' + tally(list, f => f.difficulty) : '')
      + (tally(list, f => f.hardPart) ? '<br>Hardest part: ' + tally(list, f => f.hardPart) : '')
      + (tally(list, f => f.timeShort) ? '<br>Time short in: ' + tally(list, f => f.timeShort) : '') + '</div>';
  }).join('');
  const list = fbList(), all = keys.reduce((t, x) => t + FB[x].size, 0);
  $('fbcount').textContent = list.length + ' of ' + all + ' ratings';
  if (!list.length) { $('fbrows').innerHTML = '<tr><td colspan="11" class="empty">' + (all ? 'No rating matches.' : (keys.length ? 'No student has rated a challenge paper yet.' : 'Ratings appear here once the first challenge paper opens and students submit it.')) + '</td></tr>'; return; }
  const dash = '<span class="em">—</span>';
  $('fbrows').innerHTML = list.map((o, i) => { const f = o.f;
    return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(o.name) + '</b>' + (o.email ? '<div class="em">' + esc(o.email) + '</div>' : '') + (o.mobile ? '<div class="em">' + esc(o.mobile) + '</div>' : '') + '</td>'
      + '<td><span class="pill p-' + o.x.split(':')[0] + '">' + esc(paperName(o.x)) + '</span><div class="em">' + f.lang + '</div></td>'
      + '<td>' + starHtml(f.stars) + ' <b>' + esc(f.stars) + '</b></td><td>' + (esc(f.difficulty) || dash) + '</td><td>' + (esc(f.hardPart) || dash) + '</td><td>' + (esc(timeTxt(f)) || dash) + '</td>'
      + '<td class="fbnote">' + (esc(f.issue) || dash) + '</td><td class="fbnote">' + (esc(f.comment) || dash) + '</td>'
      + '<td>' + (o.sc ? num(o.sc.marks) + (o.sc.maxMarks ? '/' + num(o.sc.maxMarks) : '') + ' · rank ' + o.sc.rank : '<span class="em">not in live rank</span>') + '</td>'
      + '<td>' + (f.at ? fmtWhen(f.at) : '') + '</td></tr>'; }).join('');
}
$('fbcsv').onclick = () => {
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['Name', 'Email', 'Mobile', 'Paper', 'Language', 'Stars', 'Level felt', 'Hardest part', 'Time was short in', 'Wrong question reported', 'Other note', 'Marks', 'Rank', 'Given on'];
  const lines = [head.map(cell).join(',')].concat(fbList().map(o => [o.name, o.email, o.mobile, paperName(o.x), o.f.lang, o.f.stars, o.f.difficulty, o.f.hardPart, timeTxt(o.f), o.f.issue, o.f.comment,
    o.sc ? num(o.sc.marks) : '', o.sc ? o.sc.rank : '', o.f.at ? fmtWhen(o.f.at) : ''].map(cell).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv' }));
  a.download = 'challenge-feedback-' + new Date(Date.now() + 19800000).toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
};
const firstList = r => Object.keys(SER).filter(k => r.reg[k]).map(k => { const n = firstRound(SER[k], r.reg[k]); return SER[k].name + ': ' + (n ? 'Mock ' + n + ' (' + fmtDay(startOf(SER[k], n)) + ')' : 'none left'); });

function paint() {
  const list = visible();
  const B = SORT !== 'reg' && TAKEN[SORT];
  $('headNo').textContent = B ? 'Rank' : '#';
  $('count').textContent = list.length + ' of ' + ROWS.length + ' students' + (B ? ' · ' + list.filter(r => B.has(r.uid)).length + ' took ' + paperName(SORT) : '');
  if (!list.length) { $('rows').innerHTML = '<tr><td colspan="7" class="empty">' + (ROWS.length ? 'No student matches.' : 'No registrations yet.') + '</td></tr>'; return; }
  $('rows').innerHTML = list.map((r, i) => {
    const wa = r.mobile.replace(/\D/g, ''); const wan = wa.length === 10 ? '91' + wa : wa;
    const tk = takenKeys(r), open = tk.find(x => OPEN === r.uid + '|' + x);
    const sd = B ? B.get(r.uid) : null;   /* sorted by a paper: the first column is the rank in it */
    return '<tr><td>' + (B ? (sd ? '<span class="rk">' + sd.rank + '</span>' : '<span class="em">—</span>') : (i+1)) + '</td>'
      + '<td><b>' + esc(r.name || 'Student') + '</b>' + (r.email ? '<div class="em">' + esc(r.email) + '</div>' : (r.full ? '' : '<div class="em">record not readable — name only</div>')) + '</td>'
      + '<td>' + (r.mobile ? esc(r.mobile) + (wan.length >= 11 ? '<br><a class="wa" target="_blank" rel="noopener" href="https://wa.me/' + wan + '">WhatsApp</a>' : '') : '<span class="em">—</span>') + '</td>'
      + '<td>' + ['chsl','cgl'].filter(k => r.reg[k]).map(k => '<span class="pill p-' + k + '">' + SER[k].name + '</span>' + (r.src[k] === 'app' ? '<span class="pill p-app">app</span>' : '')).join('') + '</td>'
      + '<td>' + ['chsl','cgl'].filter(k => r.reg[k] > 1).map(k => '<div>' + SER[k].name + ': ' + fmtWhen(r.reg[k]) + '</div>').join('') + '</td>'
      + '<td>' + firstList(r).map(x => '<div>' + esc(x) + '</div>').join('') + '</td>'
      + '<td>' + (tk.map(x => { const d = TAKEN[x].get(r.uid); return '<button class="pill p-done' + (OPEN === r.uid + '|' + x ? ' on' : '') + '" data-open="' + esc(r.uid + '|' + x) + '" title="Show marks and rank">' + esc(paperName(x)) + ' · Rank ' + d.rank + (fbOf(r.uid, x) ? ' · ' + fbOf(r.uid, x).stars + '★' : '') + '</button>'; }).join('') || '<span class="em">—</span>') + '</td></tr>'
      + (open ? detailRow(r, open) : '');
  }).join('');
}
$('rows').onclick = e => { const b = e.target.closest('[data-open]'); if (!b) return; OPEN = OPEN === b.dataset.open ? '' : b.dataset.open; paint(); };

$('csv').onclick = () => {
  const cell = v => '"' + String(v==null?'':v).replace(/"/g, '""') + '"';
  const head = ['Name','Email','Mobile','CHSL Tier 1','CHSL registered on','CGL Tier 2','CGL registered on','First paper','Papers taken'];
  const lines = [head.map(cell).join(',')].concat(visible().map(r => [r.name, r.email, r.mobile,
    r.reg.chsl ? 'Yes' : '', r.reg.chsl > 1 ? fmtWhen(r.reg.chsl) : '', r.reg.cgl ? 'Yes' : '', r.reg.cgl > 1 ? fmtWhen(r.reg.cgl) : '',
    firstList(r).join('; '), takenList(r).join('; ')].map(cell).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }));
  a.download = 'challenge-registrations-' + new Date(Date.now()+19800000).toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
};
</script>
