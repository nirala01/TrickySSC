<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Current Affairs — TrickySSC</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-3MMDNVBJQN');</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F1F5F9;color:#1E293B;min-height:100vh;}
.topbar{background:linear-gradient(135deg,#FF6B00,#FF8C38);padding:0.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:0.5rem;position:sticky;top:0;z-index:300;}
.topbar-left{display:flex;align-items:center;gap:8px;}
.brand{width:32px;height:32px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani';font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.topbar-brand{font-family:'Rajdhani';font-size:1rem;font-weight:700;color:#fff;}
.back-btn{background:rgba(255,255,255,0.2);color:#fff;padding:0.28rem 0.75rem;border-radius:100px;font-size:0.75rem;font-weight:600;text-decoration:none;}
.wrap{max-width:820px;margin:0 auto;padding:1.25rem 1rem 3rem;}
.hero{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.6rem;}
.hero h1{font-family:'Rajdhani';font-size:1.5rem;font-weight:700;}
.hero p{font-size:0.78rem;color:#64748B;margin-top:0.15rem;}
.latest{background:linear-gradient(135deg,#FF6B00,#FF8C38);color:#fff;border-radius:10px;padding:0.55rem 1rem;font-size:0.8rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;box-shadow:0 4px 14px rgba(255,107,0,0.3);}
.latest:hover{filter:brightness(1.05);}
.month{margin-top:1.1rem;}
.month h2{font-family:'Rajdhani';font-size:1.05rem;font-weight:700;color:#334155;padding:0.2rem 0.25rem 0.45rem;border-bottom:2px solid #E2E8F0;margin-bottom:0.6rem;display:flex;justify-content:space-between;align-items:center;}
.month h2 span{font-family:'Plus Jakarta Sans';font-size:0.68rem;font-weight:600;color:#94A3B8;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0.6rem;}
.day{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:0.8rem 0.95rem;text-decoration:none;color:inherit;display:flex;align-items:center;gap:0.75rem;transition:all 0.15s;border-left:4px solid #E2E8F0;}
.day:hover{border-color:#FF6B00;box-shadow:0 4px 14px rgba(255,107,0,0.12);transform:translateY(-1px);}
.day.new{border-left-color:#FF6B00;}
.dnum{font-family:'Rajdhani';font-size:1.7rem;font-weight:700;color:#FF6B00;line-height:1;min-width:2.1rem;text-align:center;}
.dtxt{flex:1;min-width:0;}
.dlabel{font-size:0.86rem;font-weight:600;color:#1E293B;}
.dsub{font-size:0.68rem;color:#94A3B8;margin-top:0.1rem;}
.badge{font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;background:#FFF7ED;color:#C2410C;border-radius:100px;padding:0.12rem 0.5rem;}
.arrow{color:#CBD5E1;font-size:0.9rem;}
.day:hover .arrow{color:#FF6B00;}
.center-box{text-align:center;padding:3rem 1rem;color:#94A3B8;font-size:0.85rem;line-height:1.7;}
.spinner{width:32px;height:32px;border:3px solid #E2E8F0;border-top-color:#FF6B00;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.err-box{background:#fff;border:1px solid #FECACA;border-radius:12px;padding:1.25rem;text-align:center;font-size:0.82rem;color:#991B1B;}
.err-box a{color:#C2410C;font-weight:600;}
.search{width:100%;border:1.5px solid #E2E8F0;border-radius:10px;padding:0.55rem 0.9rem;font-size:0.82rem;font-family:inherit;outline:none;margin-bottom:0.25rem;background:#fff;}
.search:focus{border-color:#FF6B00;}
@media(max-width:600px){.hero h1{font-size:1.25rem;}.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="brand">T</div>
    <span class="topbar-brand">TrickySSC — Current Affairs</span>
  </div>
  <a href="index.html" class="back-btn">← Home</a>
</div>

<div class="wrap">
  <div class="hero">
    <div>
      <h1>📰 Daily Current Affairs</h1>
      <p>One page per day, hand-picked for SSC CGL / CHSL / MTS. Newest first.</p>
    </div>
    <a class="latest" id="latestBtn" href="#" style="display:none;">⚡ Today's CA <span id="latestLabel"></span> →</a>
  </div>
  <input class="search" id="search" type="search" placeholder="Jump to a date… e.g. 29 Aug, August 2026, 2026" oninput="render()">
  <div id="list"><div class="center-box"><div class="spinner"></div>Loading dates…</div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  HOW THIS WORKS — nothing to build, nothing to run.
//
//  Upload one static HTML page per day into the FOLDER below, named by date:
//        ca-archive/29-08-2026.html        (DD-MM-YYYY.html)
//  Also accepted: 2026-08-29.html, 29-08-2026-current-affairs.html,
//                 ca-29-08-2026.html — the date is picked out of the file name.
//
//  This page asks GitHub's API for the folder's file list on every load, so a
//  newly uploaded day appears within ~1 minute. If the API is rate-limited
//  (shared mobile IPs), it falls back to ca-archive/index.json, which the
//  "List CA pages" workflow rewrites automatically on every upload.
//  Any non-HTML files in the folder are ignored.
// ═══════════════════════════════════════════════════════════════════════════
const REPO   = 'nirala01/TrickySSC';
const BRANCH = 'main';
const FOLDER = 'ca-archive';          // <- change if you upload elsewhere

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let entries = [];

function parseDate(name) {
  let m = name.match(/(\d{2})-(\d{2})-(\d{4})/);            // DD-MM-YYYY
  if (m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
  m = name.match(/(\d{4})-(\d{2})-(\d{2})/);                // YYYY-MM-DD
  if (m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  return null;
}
function key(d){ return `${String(d.getUTCDate()).padStart(2,'0')}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${d.getUTCFullYear()}`; }

async function listFromApi() {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${FOLDER}?ref=${BRANCH}`,
    { headers: { 'Accept': 'application/vnd.github+json' } });
  if (!r.ok) throw new Error(`GitHub API ${r.status}`);
  const files = await r.json();
  return files.filter(f => f.type === 'file').map(f => f.name);
}
async function listFromIndex() {
  // Written by .github/workflows/list-ca-pages.yml on every push to the folder.
  const r = await fetch(`${FOLDER}/index.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`index.json ${r.status}`);
  const j = await r.json();
  return Array.isArray(j) ? j : (j.files || []);
}

async function load() {
  try {
    let names;
    try { names = await listFromApi(); }
    catch (e) { console.warn('API failed, using index.json:', e.message); names = await listFromIndex(); }
    entries = names
      .filter(n => /\.html?$/i.test(n))
      .map(n => ({ name: n, date: parseDate(n), href: `${FOLDER}/${n}` }))
      .filter(e => e.date)
      .sort((a,b) => b.date - a.date);
    if (!entries.length) {
      document.getElementById('list').innerHTML =
        `<div class="center-box">No current-affairs pages yet.<br>Upload <b>${FOLDER}/DD-MM-YYYY.html</b> and it will show up here.</div>`;
      return;
    }
    const latest = entries[0];
    const btn = document.getElementById('latestBtn');
    btn.href = latest.href; btn.style.display = 'inline-flex';
    document.getElementById('latestLabel').textContent = `· ${latest.date.getUTCDate()} ${MONTHS[latest.date.getUTCMonth()].slice(0,3)}`;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      `<div class="err-box">⚠️ Could not load the date list (${e.message}).<br>
       <a href="https://github.com/${REPO}/tree/${BRANCH}/${FOLDER}">Open the archive folder directly</a></div>`;
  }
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const today = key(new Date(Date.now() + 5.5*3600*1000));
  const groups = {};
  entries.forEach(e => {
    const d = e.date;
    const label = `${DAYS[d.getUTCDay()]}, ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    const mkey  = `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    const hay   = `${label} ${mkey} ${key(d)} ${e.name}`.toLowerCase();
    if (q && !hay.includes(q)) return;
    (groups[mkey] = groups[mkey] || []).push({ ...e, label, isToday: key(d) === today });
  });
  const html = Object.entries(groups).map(([m, ds]) => `
    <div class="month"><h2>${m}<span>${ds.length} day${ds.length>1?'s':''}</span></h2>
      <div class="grid">${ds.map(e => `
        <a class="day ${e === ds[0] && m === Object.keys(groups)[0] ? 'new' : ''}" href="${e.href}">
          <div class="dnum">${e.date.getUTCDate()}</div>
          <div class="dtxt">
            <div class="dlabel">${e.label.split(', ')[1]}</div>
            <div class="dsub">${e.label.split(', ')[0]}${e.isToday ? ' &nbsp;<span class="badge">Today</span>' : ''}</div>
          </div>
          <span class="arrow">➜</span>
        </a>`).join('')}</div>
    </div>`).join('');
  document.getElementById('list').innerHTML = html || `<div class="center-box">No dates match “${q}”.</div>`;
}
load();
</script>
</body>
</html>
