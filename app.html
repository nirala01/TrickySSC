<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrickySSC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<!-- TSSC-APP-V2 (2026-11-14): the Android app's own screens, in one file.
       1. sign in first            (app-login.html, then back here)
       2. choose your exam         (#choose, remembered on the phone)
       3. home for that exam       (#home, never scrolls)
       4. pass page with Buy bar   (#p/<exam>, prices read live from config/pricing)
     Buying itself happens on the exam's mock page (app-<page>.html?buy=…), which runs the
     website's own checkout, so there is one payment flow to maintain, not two.
     No Firebase on this page, so it opens instantly. -->
<script>
/* Sign in first: nothing below is shown to a signed-out phone. */
(function(){
  try{ sessionStorage.setItem('tssc_app','1'); }catch(e){}   // tells /tssc-app.js this tab is the app
  var u=null; try{ u=JSON.parse(localStorage.getItem('tssc_user')||'null'); }catch(e){}
  if(!(u && (u.uid||u.name))){ location.replace('/app-login.html?next=/app.html'); }
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --saffron:#FF6B00; --ink:#1A202C; --dim:#64748B; --line:#EDF0F5; --bg:#FFF8F2;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tab:58px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
.app{position:fixed;inset:0;display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ---------- top bar ---------- */
.top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) 12px 8px;background:#fff;border-bottom:1px solid var(--line);min-height:calc(var(--sat) + 54px);}
.back{display:none;width:38px;height:38px;margin-left:-6px;border-radius:50%;align-items:center;justify-content:center;}
.back:active{background:#F1F5F9;}
.has-back .back{display:flex;}
.has-back .logo,.has-back .exam{display:none;}
.logo{display:flex;align-items:center;gap:7px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:-.4px;line-height:1;}
.logo i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FF6B00,#FF9A3D);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1rem;box-shadow:0 2px 8px rgba(255,107,0,.35);}
.logo b{color:var(--saffron);font-weight:800;}
.logo span.w{display:inline;}
.has-exam .logo span.w{display:none;}
/* the exam switcher, like "My Exams ▾" */
.exam{display:none;align-items:center;gap:6px;height:36px;padding:0 10px 0 12px;border-radius:100px;border:1.5px solid var(--line);background:#fff;font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:1.02rem;max-width:46vw;}
.has-exam .exam{display:flex;}
.exam span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exam svg{flex:0 0 auto;color:var(--saffron);}
.exam:active{background:#FFF7F0;}
.ttl{display:none;font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:1.25rem;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.has-back .ttl{display:block;}
.me{margin-left:auto;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:100px;background:#E8F7EF;color:#047857;font-weight:700;font-size:.82rem;max-width:36vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.me:active{transform:scale(.96);}

/* ---------- views ---------- */
.views{flex:1 1 auto;position:relative;min-height:0;}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 18px;}
.view.on{display:flex;animation:in .16s ease-out;}
@keyframes in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.view.on{animation:none;}}
@media(min-width:600px){.view{padding-left:max(14px,calc(50vw - 290px));padding-right:max(14px,calc(50vw - 290px));}}
.sh{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:1.12rem;line-height:1;margin-top:2px;}
.sh::before{content:"";width:4px;height:18px;border-radius:4px;background:var(--saffron);}
.sh small{margin-left:auto;font-family:system-ui,sans-serif;font-size:.74rem;font-weight:600;color:var(--dim);}

/* ---------- CHOOSE YOUR EXAM and HOME: never scroll ---------- */
#v-choose,#v-home{overflow:hidden;padding:12px 14px 10px;gap:10px;}
.lead{flex:0 0 auto;}
.lead h1{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:1.45rem;line-height:1.1;}
.lead p{color:var(--dim);font-size:.84rem;margin-top:3px;}
.grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;}
.xc{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:0;overflow:hidden;border-radius:18px;padding:12px 12px 10px;color:#fff;text-align:left;
  background:linear-gradient(140deg,var(--c) 10%,var(--c2) 100%);box-shadow:0 6px 14px var(--s);transition:transform .08s;}
.xc::before{content:"";position:absolute;top:-30%;right:-25%;width:75%;height:130%;background:linear-gradient(115deg,rgba(255,255,255,.2),rgba(255,255,255,0) 60%);transform:rotate(16deg);pointer-events:none;}
.xc:active{transform:scale(.965);}
.xc.sel{outline:3px solid #1A202C;outline-offset:2px;}
.xc h2{position:relative;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:clamp(1.12rem,3vh,1.4rem);line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.12);}
.xc small{position:relative;display:block;margin-top:3px;font-size:.72rem;font-weight:600;line-height:1.25;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.xc em{position:relative;font-style:normal;margin-top:7px;font-size:.66rem;font-weight:800;letter-spacing:.2px;background:rgba(255,255,255,.24);border-radius:100px;padding:3px 9px;white-space:nowrap;}
.xc .wm{position:absolute;right:10px;bottom:10px;width:clamp(34px,6.4vh,48px);height:clamp(34px,6.4vh,48px);border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:clamp(1.05rem,3.1vh,1.5rem);}
/* home: the exam's pass card */
.pass{flex:0 0 auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;border-radius:18px;padding:13px 14px;color:#fff;
  background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 6px 16px var(--s);}
.pass::after{content:"";position:absolute;right:-34px;top:-44px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);}
.pass div{min-width:0;flex:1;position:relative;z-index:1;}
.pass b{display:block;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.3rem;line-height:1.05;}
.pass p{font-size:.76rem;opacity:.95;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pass span{position:relative;z-index:1;flex:0 0 auto;height:38px;display:flex;align-items:center;padding:0 14px;border-radius:12px;background:#fff;color:var(--d);font-weight:800;font-size:.84rem;box-shadow:0 4px 10px rgba(0,0,0,.12);}
.pass:active{transform:scale(.985);}
/* home: what the student can do */
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden;border-radius:18px;padding:12px;background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.04);text-align:left;}
.tile:active{transform:scale(.965);background:#FFF7F0;}
.tile i{font-style:normal;width:clamp(34px,6vh,44px);height:clamp(34px,6vh,44px);border-radius:13px;background:var(--t);display:flex;align-items:center;justify-content:center;font-size:clamp(1.05rem,2.9vh,1.35rem);}
.tile b{display:block;font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:clamp(1rem,2.6vh,1.12rem);line-height:1.1;}
.tile small{display:block;margin-top:2px;font-size:.72rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .tag{position:absolute;top:12px;right:12px;font-size:.62rem;font-weight:800;border-radius:100px;padding:2px 8px;background:#E8F7EF;color:#047857;}
@media(max-height:700px){.xc em{display:none;}}
@media(max-height:640px){.lead p,.pass p{display:none;} #v-choose,#v-home{gap:8px;} .grid{gap:8px;} .tile small{display:none;}}
@media(max-height:540px){.xc .wm{display:none;}}
@media(max-width:340px){.xc{padding:10px 10px 8px;} .xc small{font-size:.66rem;}}

/* ---------- list screens ---------- */
.hero{flex:0 0 auto;border-radius:18px;padding:14px;background:linear-gradient(140deg,var(--c),var(--c2));color:#fff;box-shadow:0 6px 18px var(--s);}
.hero h1{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.5rem;line-height:1.05;}
.hero p{font-size:.8rem;opacity:.92;margin-top:3px;}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.facts span{background:rgba(255,255,255,.18);border-radius:8px;padding:3px 8px;font-size:.72rem;font-weight:700;}
.two{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.big{display:flex;flex-direction:column;gap:3px;border-radius:16px;padding:13px 12px;background:#fff;border:1.5px solid var(--line);min-height:104px;}
.big:active{transform:scale(.97);}
.big i{font-style:normal;font-size:1.4rem;}
.big b{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:1.08rem;line-height:1.15;}
.big small{font-size:.74rem;color:var(--dim);line-height:1.3;}
.big .tag{align-self:flex-start;margin-top:auto;font-size:.68rem;font-weight:800;border-radius:100px;padding:2px 8px;background:#E8F7EF;color:#047857;}
.sec{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin:16px 2px 7px;}
.rows{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:0;}
.row:active{background:#FFF7F0;}
.row i{flex:0 0 36px;height:36px;border-radius:11px;background:#FFF1E6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.05rem;}
.row div{min-width:0;flex:1;}
.row b{display:block;font-size:.92rem;font-weight:700;line-height:1.2;}
.row small{display:block;font-size:.74rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row svg{flex:0 0 auto;color:#CBD5E1;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:.84rem;}
.chip:active{border-color:var(--saffron);background:#FFF7F0;}
.card-me{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;}
.card-me .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#FF6B00,#FF9A3D);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:1.3rem;}
.card-me b{display:block;font-size:1rem;}
.card-me small{color:var(--dim);font-size:.78rem;}

/* ---------- PASS PAGE: details scroll, the Buy bar stays ---------- */
#v-pass{padding:0;overflow:hidden;}
.pscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 18px;}
@media(min-width:600px){.pscroll{padding-left:max(14px,calc(50vw - 290px));padding-right:max(14px,calc(50vw - 290px));}}
.gets{list-style:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 14px;}
.gets li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.35;}
.gets li:last-child{border-bottom:0;}
.gets li::before{content:"✓";flex:0 0 22px;height:22px;border-radius:50%;background:#E8F7EF;color:#047857;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-top:-1px;}
.plan{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;}
.plan .dot{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid #CBD5E1;}
.plan.on{border-color:var(--saffron);background:#FFF9F4;}
.plan.on .dot{border:6px solid var(--saffron);}
.plan div{flex:1;min-width:0;}
.plan b{display:block;font-size:.95rem;line-height:1.25;}
.plan small{display:block;font-size:.76rem;color:var(--dim);line-height:1.35;margin-top:2px;}
.plan .pr{flex:0 0 auto;text-align:right;font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:1.25rem;line-height:1;}
.plan .pr s{display:block;font-size:.8rem;color:#94A3B8;font-weight:600;margin-bottom:2px;}
.note{font-size:.78rem;color:var(--dim);line-height:1.5;margin:4px 2px 0;}
.buybar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(15,23,42,.06);}
.buybar div{flex:1;min-width:0;}
.buybar b{display:block;font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:1.5rem;line-height:1;}
.buybar b s{font-size:.9rem;color:#94A3B8;font-weight:600;margin-left:6px;}
.buybar small{display:block;font-size:.72rem;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.buybar a{flex:0 0 auto;height:48px;display:flex;align-items:center;padding:0 26px;border-radius:14px;background:linear-gradient(135deg,#FF6B00,#FF8C38);color:#fff;font-weight:800;font-size:1rem;box-shadow:0 4px 12px rgba(255,107,0,.35);}
.buybar a.own{background:linear-gradient(135deg,#059669,#34D399);box-shadow:0 4px 12px rgba(5,150,105,.3);}
.buybar a:active{transform:scale(.97);}

/* ---------- bottom tabs ---------- */
.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tab) + var(--sab));padding-bottom:var(--sab);background:#fff;border-top:1px solid var(--line);}
.no-tabs .tabs{display:none;}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.66rem;font-weight:700;color:#94A3B8;}
.tabs a svg{width:23px;height:23px;}
.tabs a.on{color:var(--saffron);}
.tabs a.on::before{content:"";position:absolute;top:0;left:50%;width:26px;height:3px;margin-left:-13px;border-radius:0 0 4px 4px;background:var(--saffron);}
.tabs a.on svg{fill:rgba(255,107,0,.14);}
.tabs a:active{transform:scale(.94);}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <button class="back" id="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="logo"><i>⚡</i><span class="w">Tricky<b>SSC</b></span></div>
    <a class="exam" id="exam" href="#choose" aria-label="Change exam"><span id="examName"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></a>
    <div class="ttl" id="ttl"></div>
    <a class="me" id="me" href="#me">Me</a>
  </header>

  <main class="views">
    <section class="view" id="v-choose">
      <div class="lead"><h1 id="chooseHi">Choose your exam</h1><p>Pick the exam you are preparing for. You can change it any time.</p></div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-pass"></section>
    <section class="view" id="v-course"></section>
    <section class="view" id="v-mocks"></section>
    <section class="view" id="v-pyq"></section>
    <section class="view" id="v-chapters"></section>
    <section class="view" id="v-me"></section>
  </main>

  <nav class="tabs" id="tabs">
    <a href="#home" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="#mocks" data-t="mocks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Mocks</a>
    <a href="#pyq" data-t="pyq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>PYQs</a>
    <a href="#chapters" data-t="chapters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7v14H4zM13 5h7v14h-7z"/></svg>Chapters</a>
    <a href="#me" data-t="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</a>
  </nav>
</div>

<script>
(function(){
  'use strict';

  /* ---------- the exams (edit here when a series changes) ----------
     pass  = the entitlement key the mock page sells (config/pricing)
     mock  = the app copy of the mock list page; Buy Now opens its checkout */
  var E = {
    cgl:{ g1:'#EA580C', g2:'#FDA047', name:'SSC CGL', sub:'Graduate level', ic:'🎯', t:'#FFE9D6', d:'#C2410C', s:'rgba(255,107,0,.28)',
      key:'ssc-cgl', pass:'ssc-cgl-mocks', mocks:'100 mocks', free:'Mock 1–4 free', facts:['Tier I · 100 Qs','60 min','200 marks','−0.50'],

      gets:['50 Tier I + 50 Tier II full-length mocks','Every subject-wise mock test','New mocks released during the year','Hindi and English, with step-by-step solutions','All India rank after every mock'],
      more:[['🏆','Tier II mock tests','Full Tier II papers','/app-ssc-cgl-tier-2-mock-test.html'],['ℹ️','SSC CGL 2026 exam info','Dates, pattern, posts','/ssc-cgl-2026.html']],
      subj:[['Maths','/ssc-cgl-quant-mock-test.html'],['Reasoning','/ssc-cgl-reasoning-mock-test.html'],['English','/ssc-cgl-english-mock-test.html'],['GK','/ssc-cgl-gk-mock-test.html']] },

      mock:'/app-ssc-chsl-mock-test.html', pyq:'/app-ssc-chsl-pyq.html',
      gets:['40 Tier I + 40 Tier II full-length mocks','Refresher mocks before the exam','Every subject-wise mock test','Hindi and English, with step-by-step solutions','All India rank after every mock'],
      more:[['🏆','Tier II mock tests','Full Tier II papers','/app-ssc-chsl-tier-2-mock-test.html'],['ℹ️','SSC CHSL 2026 exam info','Dates, pattern, posts','/ssc-chsl-2026.html']],
      subj:[['Maths','/ssc-chsl-quant-mock-test.html'],['Reasoning','/ssc-chsl-reasoning-mock-test.html'],['English','/ssc-chsl-english-mock-test.html'],['GK','/ssc-chsl-gk-mock-test.html']] },
    mts:{ g1:'#047857', g2:'#34D399', name:'SSC MTS', sub:'10th level', ic:'📝', t:'#DBF7EC', d:'#047857', s:'rgba(16,185,129,.28)',
      key:'ssc-mts', pass:'ssc-mts-mocks', mocks:'60 mocks', free:'Mock 1–2 free', facts:['90 Qs','90 min','270 marks','2 sessions'],
      mock:'/app-ssc-mts-mock-test.html', pyq:'/ssc-mts.html#mts-pyq-page',
      gets:['60 full-length mocks on the latest pattern','Every subject-wise mock test','New mocks released during the year','Hindi and English, with step-by-step solutions','All India rank after every mock'],
      more:[['ℹ️','SSC MTS 2027 exam info','Dates, pattern, syllabus','/ssc-mts-2027.html']],
      subj:[['Maths','/ssc-mts-maths-mock-test.html'],['Reasoning','/ssc-mts-reasoning-mock-test.html'],['English','/ssc-mts-english-mock-test.html'],['GK','/ssc-mts-gk-mock-test.html']] },
    gd:{ g1:'#B91C1C', g2:'#F87171', name:'SSC GD', sub:'Constable', ic:'🛡️', t:'#FDE4E4', d:'#B91C1C', s:'rgba(239,68,68,.28)',
      key:'ssc-gd', pass:'ssc-gd-mocks', mocks:'60 mocks', free:'Mock 1–2 free', facts:['80 Qs','60 min','160 marks','−0.25'],
      mock:'/app-ssc-gd-mock-test.html', pyq:'/app-ssc-gd-pyq.html',
      gets:['60 full-length mocks on the CBE pattern','Every subject-wise mock test','Challenge mocks at the hardest real shift level','Hindi and English, with step-by-step solutions','All India rank after every mock'],
      more:[['ℹ️','SSC GD 2027 exam info','Dates, vacancy, PET/PST','/ssc-gd-2027.html']],
      subj:[['Maths','/ssc-gd-maths-mock-test.html'],['Reasoning','/ssc-gd-reasoning-mock-test.html'],['English','/ssc-gd-english-mock-test.html'],['GK','/ssc-gd-gk-mock-test.html']] },
    ntpc:{ g1:'#1E3FAE', g2:'#60A5FA', name:'RRB NTPC', sub:'Railway · Graduate', ic:'🚆', t:'#DCE7FD', d:'#1E40AF', s:'rgba(29,78,216,.28)',
      key:'ssc-rrb-ntpc', pass:'rrb-ntpc-mocks', mocks:'60 mocks', free:'Mock 1–3 free', facts:['CBT-1 · 100 Qs','90 min','100 marks','−1/3'],
      mock:'/app-rrb-ntpc-mock-test.html', pyq:'/app-rrb-ntpc-pyq.html',
      gets:['60 full-length CBT-1 mocks','Every subject-wise mock test','New mocks released during the year','Hindi and English, with step-by-step solutions','All India rank after every mock'],
      more:[],
      subj:[['Maths','/rrb-ntpc-maths-mock-test.html'],['Reasoning','/rrb-ntpc-reasoning-mock-test.html'],['GK','/rrb-ntpc-gk-mock-test.html']] }
  };
  var ORDER = ['cgl','chsl','mts','gd','ntpc'];
  var OTHER = [['👮','SSC CPO','Central Police · Sub-Inspector','/ssc-cpo.html'],['✍️','SSC JHT','Junior Hindi Translator','/ssc-jht.html'],['⚙️','SSC JE','Junior Engineer','/ssc-je.html']];
  var CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var PAPERS = {};   // exam key -> papers count, from /pyq-chapters/index.json
  var EXAM_KEY = 'tssc_app_exam';

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function row(r){ return '<a class="row" href="'+r[3]+'"><i>'+r[0]+'</i><div><b>'+esc(r[1])+'</b><small>'+esc(r[2])+'</small></div>'+CHEV+'</a>'; }
  function papersText(k){ var n=PAPERS[E[k].key]; return n ? n+' PYQ papers' : 'PYQ papers'; }
  function papersShort(k){ var n=PAPERS[E[k].key]; return n ? n+' papers' : 'PYQs'; }
  function user(){ try{ var u=JSON.parse(localStorage.getItem('tssc_user')||'null'); return (u && (u.uid||u.name)) ? u : null; }catch(e){ return null; } }
  function first(u){ var n=String((u&&u.name)||'').trim(); return (n && n!=='Student') ? n.split(/\s+/)[0] : ''; }
  function myExam(){ var k=''; try{ k=localStorage.getItem(EXAM_KEY)||''; }catch(e){} return E[k] ? k : ''; }
  function setExam(k){ try{ localStorage.setItem(EXAM_KEY,k); }catch(e){} }
  /* passes this phone already knows about (the mock page caches them for the session) */
  function owns(k){
    var u=user(); if(!u||!u.uid) return false;
    try{ var o=JSON.parse(sessionStorage.getItem('tssc_ent_v2_'+u.uid)||'null'); var m=(o&&o.m)||{};
      return m[E[k].pass]===true || m['all-mocks']===true || m.all===true; }catch(e){ return false; }
  }

  /* ---------- choose your exam ---------- */
  function renderChoose(){
    var cur=myExam(), h='', n=first(user());
    $('chooseHi').textContent = n ? 'Hi '+n+', choose your exam' : 'Choose your exam';
    ORDER.forEach(function(k){ var x=E[k];
      h+='<button class="xc'+(k===cur?' sel':'')+'" data-exam="'+k+'" style="--c:'+x.g1+';--c2:'+x.g2+';--s:'+x.s+'">'
        +'<h2>'+x.name+'</h2><small>'+x.mocks+' · <span data-p="'+k+'">'+papersShort(k)+'</span></small><em>'+x.free+'</em><span class="wm">'+x.ic+'</span></button>';
    });
    h+='<a class="xc" href="#c/more" style="--c:#4338CA;--c2:#818CF8;--s:rgba(79,70,229,.3)">'
      +'<h2>More exams</h2><small>CPO · JHT · JE</small><em>Papers &amp; exam info</em><span class="wm">➕</span></a>';
    $('grid').innerHTML=h;
  }
  $('grid').addEventListener('click', function(e){
    var b=e.target.closest ? e.target.closest('[data-exam]') : null; if(!b) return;
    setExam(b.getAttribute('data-exam'));
    if(location.hash==='#home') route(); else location.hash='#home';
  });

  /* ---------- home for the chosen exam ---------- */
  function renderHome(k){
    var x=E[k], own=owns(k);
    $('v-home').innerHTML =
      '<a class="pass" href="#p/'+k+'" style="--c:'+x.g1+';--c2:'+x.g2+';--s:'+x.s+';--d:'+x.d+'"><div><b>'+x.ic+' '+x.name+' Mock Pass</b>'
      +'<p>'+x.mocks+' · '+x.free+' · Hindi &amp; English</p></div><span>'+(own?'✓ Active':'View pass')+'</span></a>'
      +'<div class="sh">Start practising</div>'
      +'<div class="grid">'
      + tile(x.mock,'🎯','Mock tests',x.mocks,x.free,x.t)
      + tile(x.pyq,'📄','Previous year papers','<span data-p2="'+k+'">'+papersText(k)+'</span>','Free',x.t)
      + tile('/ssc-cgl-chapterwise.html','📚','Chapter tests','New questions · 2 levels','Free',x.t)
      + tile('/ssc-pyq-chapterwise.html','🗂️','Chapter PYQs','Real questions by chapter','Free',x.t)
      + tile('#c/'+k,'🧩','Subject-wise mocks',x.subj.map(function(s){return s[0];}).join(' · '),'',x.t)
      + tile('/current-affairs.html','📰','Current affairs','Daily, for SSC &amp; Railway','',x.t)
      +'</div>';
  }
  function tile(href,ic,title,sub,tag,tint){
    return '<a class="tile" href="'+href+'" style="--t:'+tint+'"><i>'+ic+'</i>'+(tag?'<span class="tag">'+tag+'</span>':'')
      +'<span><b>'+title+'</b><small>'+sub+'</small></span></a>';
  }

  /* ---------- pass page: what you get, the plans, and the Buy bar ---------- */
  var PASS = { k:'', plans:[], pick:'' };
  function renderPass(k){
    var x=E[k]; if(!x) return null;
    PASS = { k:k, plans:[], pick:'' };
    $('v-pass').innerHTML =
      '<div class="pscroll">'
      +'<div class="hero" style="--c:'+x.g1+';--c2:'+x.g2+';--s:'+x.s+'"><h1>'+x.ic+' '+x.name+' Mock Pass</h1><p>'+x.sub+' · '+x.mocks+' · Hindi &amp; English</p>'
      +'<div class="facts">'+x.facts.map(function(f){return '<span>'+f+'</span>';}).join('')+'</div></div>'
      +'<div class="sec">What you get</div><ul class="gets">'+x.gets.map(function(g){return '<li>'+esc(g)+'</li>';}).join('')+'<li>'+esc(x.free)+' — try before you buy</li></ul>'
      +'<div class="sec">Choose a plan</div><div id="plans"><p class="note">Loading plans…</p></div>'
      +'<p class="note">One payment, no auto-renewal. The price shown at checkout is final. Payments are handled securely by Razorpay.</p>'
      +'</div>'
      +'<div class="buybar" id="buybar"><div><b id="bbPrice">—</b><small id="bbLabel">'+x.name+' Mock Pass</small></div><a id="bbGo" href="'+x.mock+'">View mocks</a></div>';
    if(owns(k)) paintOwned(k);
    loadPricing(function(P,cat){
      if(PASS.k!==k) return;                       // the student moved on
      var seen={}, list=[];
      P.productsGranting(cat,x.pass).concat(P.productsGranting(cat,'all-mocks')).forEach(function(p){ if(!seen[p.id]){ seen[p.id]=1; list.push(p); } });
      list.sort(function(a,b){ return a.price-b.price; });
      PASS.plans=list;
      if(!list.length){ $('plans').innerHTML='<p class="note">Plans are not available right now. Open the mock list to see the current offer.</p>'; return; }
      PASS.pick=list[0].id;
      paintPlans();
    }, function(){
      if(PASS.k===k) $('plans').innerHTML='<p class="note">Could not load the plans. Check your internet, or open the mock list to see the current offer.</p>';
    });
    return x.name+' Mock Pass';
  }
  function years(d){ d=Number(d)||365; return d>=365 ? Math.round(d/365)+' year' : d+' days'; }
  function paintPlans(){
    var x=E[PASS.k];
    $('plans').innerHTML = PASS.plans.map(function(p){
      var all=(p.grants||[]).indexOf('all-mocks')!==-1, n=(p.grants||[]).length;
      var sub = p.blurb ? p.blurb : (all ? 'Every mock series on TrickySSC' : (n>1 ? n+' series in one pass' : x.mocks+' and every subject-wise test'));
      return '<button class="plan'+(p.id===PASS.pick?' on':'')+'" data-plan="'+esc(p.id)+'"><span class="dot"></span><div><b>'+esc(p.label||'Mock Pass')+'</b><small>'+esc(sub)+' · valid '+years(p.durationDays)+'</small></div>'
        +'<span class="pr">'+(p.mrp&&p.mrp>p.price?'<s>₹'+p.mrp+'</s>':'')+'₹'+p.price+'</span></button>';
    }).join('');
    paintBar();
  }
  function paintBar(){
    var x=E[PASS.k]; if(owns(PASS.k)){ paintOwned(PASS.k); return; }
    var p=null; PASS.plans.forEach(function(q){ if(q.id===PASS.pick) p=q; }); if(!p) return;
    var all=(p.grants||[]).indexOf('all-mocks')!==-1;
    $('bbPrice').innerHTML='₹'+p.price+(p.mrp&&p.mrp>p.price?'<s>₹'+p.mrp+'</s>':'');
    $('bbLabel').textContent=(p.label||'Mock Pass')+' · '+years(p.durationDays);
    var go=$('bbGo'); go.className=''; go.textContent='Buy Now';
    /* the exam's mock page runs the checkout; ?pass=all is its own switch for the All Mocks Pass */
    go.href = x.mock + (all ? '?pass=all' : '?buy='+encodeURIComponent(p.id));
  }
  function paintOwned(k){
    var x=E[k];
    $('bbPrice').textContent='✓ Pass active'; $('bbLabel').textContent='Every '+x.name+' mock is unlocked on this account';
    var go=$('bbGo'); go.className='own'; go.textContent='Open mocks'; go.href=x.mock;
  }
  $('v-pass').addEventListener('click', function(e){
    var b=e.target.closest ? e.target.closest('[data-plan]') : null; if(!b) return;
    PASS.pick=b.getAttribute('data-plan'); paintPlans();
  });
  /* prices are data: the same config/pricing the website and the payment server read */
  var _pricing=null;
  function loadPricing(ok, fail){
    function run(){ window.TSSC_PRICING.load().then(function(cat){ ok(window.TSSC_PRICING,cat); }).catch(fail); }
    if(window.TSSC_PRICING){ run(); return; }
    if(!_pricing){ _pricing=new Promise(function(res,rej){ var s=document.createElement('script'); s.src='/tssc-pricing.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
    _pricing.then(run).catch(fail);
  }

  /* ---------- exam details (subject-wise mocks and extras) ---------- */
  function renderCourse(k){
    var v=$('v-course'), h='';
    if(k==='more'){
      h='<div class="hero" style="--c:#4338CA;--c2:#818CF8;--s:rgba(99,102,241,.28)"><h1>More SSC exams</h1><p>Previous year papers and exam details</p></div>'
       +'<div class="sec">Exams</div><div class="rows">'+OTHER.map(row).join('')+'</div>';
      v.innerHTML=h; return 'More exams';
    }
    var x=E[k]; if(!x) return null;
    h+='<div class="hero" style="--c:'+x.g1+';--c2:'+x.g2+';--s:'+x.s+'"><h1>'+x.ic+' '+x.name+'</h1><p>'+x.sub+' · Hindi &amp; English</p>'
      +'<div class="facts">'+x.facts.map(function(f){return '<span>'+f+'</span>';}).join('')+'</div></div>';
    h+='<div class="sec">Subject-wise mocks</div><div class="chips">'+x.subj.map(function(s){return '<a class="chip" href="'+s[1]+'">'+s[0]+'</a>';}).join('')+'</div>';
    h+='<div class="sec">Full papers</div><div class="rows">'
      +row(['🎯','Mock tests',x.mocks+' · '+x.free,x.mock])
      +row(['📄','Previous year papers',papersText(k)+' · free',x.pyq])
      +x.more.map(row).join('')+'</div>';
    v.innerHTML=h; v.scrollTop=0; return x.name;
  }

  /* ---------- tab screens ---------- */
  function ordered(){ var m=myExam(); return m ? [m].concat(ORDER.filter(function(k){return k!==m;})) : ORDER; }
  function renderMocks(){
    var h='<div class="sec" style="margin-top:2px">Full mock test series</div><div class="rows">';
    ordered().forEach(function(k){ var x=E[k]; h+=row([x.ic,x.name+' mock tests',x.mocks+' · '+x.free,x.mock]); });
    h+='</div><div class="sec">Tier II</div><div class="rows">'
      +row(['🏆','SSC CGL Tier II mocks','Full Tier II papers','/app-ssc-cgl-tier-2-mock-test.html'])
      +row(['🏆','SSC CHSL Tier II mocks','Full Tier II papers','/app-ssc-chsl-tier-2-mock-test.html'])+'</div>';
    $('v-mocks').innerHTML=h;
  }
  function renderPyq(){
    var h='<div class="sec" style="margin-top:2px">Previous year papers · all free</div><div class="rows">';
    ordered().forEach(function(k){ var x=E[k]; h+=row([x.ic,x.name+' papers',papersText(k)+' · shift-wise',x.pyq]); });
    h+='</div><div class="sec">By chapter</div><div class="rows">'+row(['🗂️','Chapter-wise PYQs','Every real question sorted into its chapter','/ssc-pyq-chapterwise.html'])+'</div>';
    $('v-pyq').innerHTML=h;
  }
  function renderChapters(){
    $('v-chapters').innerHTML='<div class="two" style="margin-top:0">'
      +'<a class="big" href="/ssc-cgl-chapterwise.html"><i>📚</i><b>Chapter tests</b><small>New questions, Level 1 and Level 2</small><span class="tag">Free</span></a>'
      +'<a class="big" href="/ssc-pyq-chapterwise.html"><i>🗂️</i><b>Chapter PYQs</b><small>Real exam questions by chapter</small><span class="tag">Free</span></a></div>'
      +'<div class="sec">Pick a subject</div><div class="rows">'
      +row(['📐','Maths','Chapter-wise tests','/ssc-cgl-quant-chapter-wise-test.html'])
      +row(['🧠','Reasoning','Chapter-wise tests','/ssc-cgl-reasoning-chapter-wise-test.html'])
      +row(['📖','English','Chapter-wise tests','/ssc-cgl-english-chapter-wise-test.html'])
      +row(['🌍','General Knowledge','Chapter-wise tests','/ssc-cgl-gk-chapter-wise-test.html'])+'</div>';
  }
  function renderMe(){
    var u=user()||{}, n=first(u)||'Student', k=myExam();
    $('v-me').innerHTML=
      '<div class="card-me"><div class="av">'+esc(n.charAt(0).toUpperCase())+'</div><div><b>'+esc((u.name&&u.name!=='Student')?u.name:'Student')+'</b><small>Signed in</small></div></div>'
      +'<div class="sec">My account</div><div class="rows">'
      +row(['🎓','My exam',k?E[k].name+' · tap to change':'Choose your exam','#choose'])
      +row(['📊','My dashboard','Scores, ranks and attempted tests','/dashboard.html'])
      +row(['🧾','My orders','Passes you have bought','/my-orders.html'])+'</div>'
      +'<div class="sec">More</div><div class="rows">'
      +row(['📰','Current affairs','Daily, for SSC and Railway exams','/current-affairs.html'])
      +row(['📓','Study notes','Short notes and tricks','/study-notes.html'])
      +row(['✈️','Telegram channel','Updates and doubts','https://t.me/trickyssc'])
      +row(['✉️','Contact us','Help with payments or tests','/contact.html'])+'</div>'
      +'<div class="sec">About</div><div class="rows">'
      +row(['🔒','Privacy policy','','/privacy-policy.html'])
      +row(['📜','Terms','','/terms.html'])
      +row(['↩️','Refund policy','','/refund-policy.html'])+'</div>';
  }

  /* ---------- routing: #choose, #home, #p/<exam>, #c/<exam>, #mocks, #pyq, #chapters, #me ---------- */
  var TITLES={mocks:'Mock tests',pyq:'Previous year papers',chapters:'Chapter-wise practice',me:'My account'};
  function route(){
    if(!user()) return;                                  // being sent to sign in
    var h=(location.hash||'#home').slice(1), view='home', title='', tab='home', back=false, k=myExam();
    if(h.indexOf('p/')===0){ title=renderPass(h.slice(2)); if(title){ view='pass'; back=true; } }
    else if(h.indexOf('c/')===0){ title=renderCourse(h.slice(2)); if(title){ view='course'; back=true; } }
    else if(TITLES[h]){ view=h; tab=h; title=TITLES[h]; if(h==='me') renderMe(); if(h==='mocks') renderMocks(); if(h==='pyq') renderPyq(); }
    else if(h==='choose'){ view='choose'; }
    if(view==='home'){ if(!k){ view='choose'; } else renderHome(k); }
    if(view==='choose') renderChoose();

    var vs=document.querySelectorAll('.view'); for(var i=0;i<vs.length;i++) vs[i].classList.toggle('on', vs[i].id==='v-'+view);
    var ts=document.querySelectorAll('.tabs a'); for(var j=0;j<ts.length;j++) ts[j].classList.toggle('on', ts[j].getAttribute('data-t')===tab);
    var top=$('top'), app=$('app');
    top.classList.toggle('has-back', back || (view==='choose' && !!k));
    top.classList.toggle('has-exam', !!k && view!=='choose' && !back);
    app.classList.toggle('no-tabs', view==='choose' && !k);     // first run: nothing to tab to yet
    $('ttl').textContent = back ? title : (view==='choose' && k ? 'Change exam' : '');
    $('examName').textContent = k ? E[k].name : '';
    var n=first(user()); $('me').textContent='👤 '+(n||'Me');
  }
  $('back').addEventListener('click', function(){ if(history.length>1) history.back(); else location.hash='#home'; });
  window.addEventListener('hashchange', route);
  window.addEventListener('pageshow', function(){ route(); });   // back from a mock page: the pass may be active now

  /* ---------- live PYQ paper counts (one small static file, cached for the session) ---------- */
  function applyPapers(){
    ORDER.forEach(function(k){
      var a=document.querySelectorAll('[data-p="'+k+'"]'), b=document.querySelectorAll('[data-p2="'+k+'"]'), i;
      for(i=0;i<a.length;i++) a[i].textContent=papersShort(k);
      for(i=0;i<b.length;i++) b[i].textContent=papersText(k);
    });
  }
  function loadPapers(){
    try{ var c=JSON.parse(sessionStorage.getItem('tssc_app_papers')||'null'); if(c){ PAPERS=c; applyPapers(); return; } }catch(e){}
    fetch('/pyq-chapters/index.json').then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
      var ex=d.exams||{}, o={}; Object.keys(ex).forEach(function(k){ if(ex[k] && ex[k].papers) o[k]=ex[k].papers; });
      PAPERS=o; try{ sessionStorage.setItem('tssc_app_papers', JSON.stringify(o)); }catch(e){}
      applyPapers();
    }).catch(function(){});
  }

  renderChapters(); route();
  if('requestIdleCallback' in window) requestIdleCallback(loadPapers); else setTimeout(loadPapers, 300);
  if('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
})();
</script>
