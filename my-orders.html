<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F0F2F7;color:#1E293B;min-height:100vh;}

/* ===== TrickySSC standard nav (matches main site) ===== */
:root{ --saffron:#FF6B00; --saffron-light:#FF8C38; --text-dim:#4A5568; }
nav.tssc-nav{ position:sticky; top:0; z-index:1000; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.06); border-bottom:1px solid #E2E8F0; padding:0 2rem; }
nav.tssc-nav .nav-inner{ max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; }
nav.tssc-nav .logo{ font-family:'Baloo 2',cursive; font-size:1.7rem; font-weight:800; letter-spacing:-0.5px; color:#1A202C; text-decoration:none; cursor:pointer; }
nav.tssc-nav .logo span{ color:var(--saffron); }
nav.tssc-nav .nav-links{ display:flex; gap:0.15rem; list-style:none; align-items:center; margin:0; padding:0; }
nav.tssc-nav .nav-links a{ display:block; padding:0.45rem 0.85rem; font-family:'Rajdhani',sans-serif; font-size:0.88rem; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#4A5568; text-decoration:none; border-radius:6px; transition:all 0.2s; cursor:pointer; }
nav.tssc-nav .nav-links a:hover{ color:var(--saffron); background:rgba(255,107,0,0.08); }
nav.tssc-nav .hamburger{ display:none; cursor:pointer; flex-direction:column; gap:5px; }
nav.tssc-nav .hamburger span{ display:block; width:24px; height:2px; background:#1A202C; border-radius:2px; }
@media (max-width:768px){
  nav.tssc-nav{ padding:0 1rem; }
  nav.tssc-nav .nav-links{ display:none; }
  nav.tssc-nav .hamburger{ display:flex; }
}
.tssc-mobile-menu{ display:none; position:fixed; top:64px; left:0; right:0; background:#fff; border-bottom:1px solid #E2E8F0; padding:1rem; z-index:999; flex-direction:column; gap:0.25rem; max-height:calc(100vh - 64px); overflow-y:auto; }
.tssc-mobile-menu.open{ display:flex; }
.tssc-mobile-menu > a{ padding:0.75rem 1rem; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:1rem; letter-spacing:0.5px; color:var(--text-dim); text-decoration:none; border-radius:8px; }
.tssc-mobile-menu > a:hover{ background:rgba(255,107,0,0.08); color:var(--saffron); }

/* ---- auth-aware nav ---- */
[hidden]{ display:none !important; }
nav.tssc-nav .nav-cta{ background:linear-gradient(135deg,#FF6B00,#FF8C38); color:#fff !important; padding:0.45rem 1.1rem; border-radius:100px; font-weight:700; }
nav.tssc-nav .nav-user{ display:flex; align-items:center; gap:0.4rem; }
nav.tssc-nav .nav-user .nav-name{ display:block; padding:0.45rem 1rem; border-radius:100px; background:rgba(255,107,0,0.10); color:var(--saffron); font-family:'Rajdhani',sans-serif; font-size:0.88rem; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; text-decoration:none; max-width:150px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
nav.tssc-nav .nav-user .nav-name:hover{ background:rgba(255,107,0,0.18); }
nav.tssc-nav .nav-logout{ font-family:'Rajdhani',sans-serif; font-size:0.85rem; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#4A5568; background:none; border:1px solid #E2E8F0; border-radius:100px; padding:0.4rem 0.9rem; cursor:pointer; }
nav.tssc-nav .nav-logout:hover{ color:#B91C1C; border-color:#FECACA; background:#FEF2F2; }
.tssc-mobile-menu .m-out{ color:#B91C1C; }

.wrap{max-width:860px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
.crumb{font-size:0.78rem;color:#94A3B8;margin-bottom:1rem;}
.crumb a{color:#FF6B00;text-decoration:none;font-weight:600;}

.hero{background:linear-gradient(135deg,#1E1B4B 0%,#1E3A5F 55%,#0F4C81 100%);border-radius:18px;padding:1.6rem 1.75rem;margin-bottom:1.25rem;box-shadow:0 8px 32px rgba(15,30,60,0.2);}
.hero h1{font-family:'Rajdhani',sans-serif;font-size:clamp(1.3rem,4vw,1.7rem);font-weight:800;color:#fff;line-height:1.15;}
.hero p{color:rgba(255,255,255,0.55);font-size:0.82rem;margin-top:0.3rem;}

.panel{background:#fff;border:1px solid #E8ECF2;border-radius:14px;padding:1.5rem;text-align:center;}
.panel h2{font-family:'Rajdhani',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:0.4rem;}
.panel p{font-size:0.88rem;color:#64748B;line-height:1.6;}
.btn{display:inline-block;margin-top:1rem;background:linear-gradient(135deg,#FF6B00,#FF8C38);color:#fff;text-decoration:none;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:0.95rem;padding:0.65rem 1.5rem;border-radius:100px;border:none;cursor:pointer;}
.btn.ghost{background:none;color:#FF6B00;border:1px solid #FFD5B8;}

.order{background:#fff;border:1px solid #E8ECF2;border-radius:14px;padding:1.25rem 1.4rem;margin-bottom:1rem;}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:0.9rem;}
.order-course{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.08rem;color:#1A202C;}
.order-amt{font-family:'Rajdhani',sans-serif;font-weight:800;font-size:1.25rem;color:#1A202C;white-space:nowrap;}
.pill{display:inline-block;border-radius:100px;padding:0.15rem 0.6rem;font-size:0.7rem;font-weight:700;font-family:'Rajdhani',sans-serif;letter-spacing:0.3px;text-transform:uppercase;}
.p-paid{background:#DCFCE7;color:#15803D;}
.p-pending{background:#FEF3C7;color:#B45309;}
.p-active{background:#DCFCE7;color:#15803D;}
.p-exp{background:#FEE2E2;color:#B91C1C;}
/* TSSC-ORDERCARD-V2 — which course, and what it unlocked */
.order-kicker{font-size:0.66rem;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:0.1rem;}
.exam-chip{display:inline-block;border-radius:6px;padding:0.1rem 0.45rem;font-size:0.68rem;font-weight:700;font-family:'Rajdhani',sans-serif;letter-spacing:0.3px;margin-left:0.35rem;vertical-align:2px;}
.ex-cgl{background:#FFF1E6;color:#C2410C;}
.ex-chsl{background:#E0F2FE;color:#0369A1;}
.ex-combo{background:#EDE9FE;color:#6D28D9;}
.gets{margin:0 0 0.9rem;padding:0.7rem 0.85rem;background:#F8FAFC;border:1px solid #EEF2F7;border-radius:10px;}
.gets-h{font-size:0.68rem;color:#64748B;text-transform:uppercase;letter-spacing:0.4px;font-weight:700;margin-bottom:0.35rem;}
.gets ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.25rem;}
.gets li{font-size:0.86rem;color:#1E293B;line-height:1.45;}
.gets li .d{color:#15803D;font-weight:600;}
.gets li.x{color:#94A3B8;}
.gets li.x .d{color:#B91C1C;}
.gets-none{font-size:0.84rem;color:#92400E;}

.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0.65rem 1.25rem;border-top:1px solid #F1F5F9;padding-top:0.9rem;}
.row-l{font-size:0.68rem;color:#94A3B8;text-transform:uppercase;letter-spacing:0.4px;font-weight:600;}
.row-v{font-size:0.86rem;color:#1E293B;font-weight:500;margin-top:0.1rem;word-break:break-all;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.8rem;}

.note{background:#FFF7ED;border:1px solid #FFE4CC;border-radius:12px;padding:0.9rem 1.1rem;font-size:0.82rem;color:#7C4A17;line-height:1.6;margin-top:1.25rem;}
.note a{color:#C2410C;font-weight:600;}
.shimmer{background:#fff;border:1px solid #E8ECF2;border-radius:14px;height:150px;margin-bottom:1rem;position:relative;overflow:hidden;}
.shimmer::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,0.035),transparent);animation:sh 1.3s infinite;}
@keyframes sh{to{transform:translateX(100%);}}
</style>

<script>
function tsscToggleMenu(){document.getElementById('tsscMobileMenu').classList.toggle('open');}

/* The nav is painted twice: once here from the tssc_user profile the login page
   caches in localStorage, so a signed-in student never sees a "Login" flash,
   and again from onAuthStateChanged below, which is the authority. */
function tsscPaintNav(u){
  var box=document.getElementById('navUserBox'), login=document.getElementById('navLoginBtn');
  var mLog=document.getElementById('mLogin'), mDash=document.getElementById('mDash'), mOut=document.getElementById('mLogout');
  if(!box) return;
  if(u){
    var name = u.displayName || u.name || (u.email ? String(u.email).split('@')[0] : '') || (u.phoneNumber || u.phone || '') || 'Student';
    var first = String(name).trim().split(/\s+/)[0].slice(0,14) || 'Student';
    document.getElementById('navUserName').textContent = '👤 ' + first;
    box.hidden=false; login.hidden=true;
    mLog.hidden=true;  mDash.hidden=false; mOut.hidden=false;
  } else {
    box.hidden=true;  login.hidden=false;
    mLog.hidden=false; mDash.hidden=true;  mOut.hidden=true;
  }
}
try{
  var _c = JSON.parse(localStorage.getItem('tssc_user') || 'null');
  if(_c && _c.uid) tsscPaintNav(_c);
}catch(e){}

/* Replaced by the module below once Firebase auth has loaded. */
window.tsscLogout = function(){
  try{ localStorage.removeItem('tssc_user'); }catch(e){}
  location.href = 'https://trickyssc.com/index.html';
};

/* Send the student back here after signing in. */
function tsscGoLogin(){
  try{ localStorage.setItem('loginReturnTo', location.href); }catch(e){}
  location.href = 'https://trickyssc.com/login.html';
}
</script>

    <p>Your purchases, payment details and course access</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyC4kjEYEZ6Zit9su9V5xpUhMd7vLhE90zA",
  authDomain:"trickyssc-17bb3.firebaseapp.com",
  projectId:"trickyssc-17bb3",
  storageBucket:"trickyssc-17bb3.firebasestorage.app",
  messagingSenderId:"450627057220",
  appId:"1:450627057220:web:366267bf437d94f20c6e11"
});
const auth = getAuth(app);
const db   = getFirestore(app);
const out  = document.getElementById('out');

/* Real sign-out, now that Firebase auth is available. */
window.tsscLogout = async () => {
  try { await signOut(auth); } catch (e) { console.warn('signOut failed', e); }
  try { localStorage.removeItem('tssc_user'); } catch (_) {}
  location.href = 'https://trickyssc.com/index.html';
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Firestore timestamps arrive either as ISO strings or as {seconds}. */
const ts = v => {
  if (!v) return 0;
  if (typeof v === 'string') return Date.parse(v) || 0;
  if (typeof v === 'number') return v < 1e12 ? v * 1000 : v;
  if (v.seconds) return v.seconds * 1000;
  if (v.toDate)  { try { return v.toDate().getTime(); } catch { return 0; } }
  return 0;
};

/* Date AND time — students ask "when exactly did I pay". */
const fmtDT = t => t
  ? new Date(t).toLocaleString('en-IN',
      { day:'numeric', month:'short', year:'numeric',
        hour:'numeric', minute:'2-digit', hour12:true })
  : '—';

const fmtD = t => t
  ? new Date(t).toLocaleDateString('en-IN',
      { day:'numeric', month:'short', year:'numeric' })
  : '—';

function signedOut() {
  out.innerHTML = `
    <div class="panel">
      <h2>Please sign in</h2>
      <p>Sign in with the same method you used when you bought the course &mdash;
         Google or mobile OTP. Each login method creates a separate account, so a
         purchase made with one will not appear under the other.</p>
      <button class="btn" onclick="tsscGoLogin()">Sign in</button>
    </div>`;
}

function noOrders(email) {
  out.innerHTML = `
    <div class="panel">
      <h2>No orders yet</h2>
      <p>You are signed in${email ? ' as <strong>' + esc(email) + '</strong>' : ''},
         but there are no purchases on this account.</p>
      <p style="margin-top:.6rem;">If you have paid and this looks wrong, you may have
         bought using a different login method. Write to
         <a href="mailto:contact@trickyssc.com" style="color:#FF6B00;font-weight:600;">contact@trickyssc.com</a>
         with your payment ID and we will fix it.</p>
      <a class="btn" href="https://trickyssc.com/mock-list.html?exam=ssc-cgl">Browse mock tests</a>
    </div>`;
}

/* TSSC-ORDERCARD-V2 (2026-10-14) — every order says plainly WHICH course was
   bought and lists what that purchase unlocked, each line with its own date.
   Display only: nothing here changes anyone's access. */
const COURSE = {
  'p-ssc-cgl-mocks':      { name: 'SSC CGL Mock Test Series 2026',          chip: 'SSC CGL',      cls: 'ex-cgl' },
  'p-ssc-chsl-mocks':     { name: 'SSC CHSL Mock Test Series 2026',         chip: 'SSC CHSL',     cls: 'ex-chsl' },
  'p-ssc-cgl-chsl-combo': { name: 'SSC CGL + SSC CHSL Mock Tests (Combo)',  chip: 'CGL + CHSL',   cls: 'ex-combo' },
  'p-ssc-cgl-dashboard':  { name: 'Rank & performance analysis',            chip: 'SSC CGL',      cls: 'ex-cgl' },
  'p-upgrade-chsl':       { name: 'SSC CHSL Mock Test Series 2026 (upgrade)', chip: 'SSC CHSL', cls: 'ex-chsl' },
  'p-upgrade-cgl':        { name: 'SSC CGL Mock Test Series 2026 (upgrade)',  chip: 'SSC CGL',  cls: 'ex-cgl' }
};
const KEYNAME = {
  'ssc-cgl-mocks':     'SSC CGL mock tests (Tier I + Tier II)',
  'ssc-chsl-mocks':    'SSC CHSL mock tests (Tier I + Tier II)'
};
const KEYORDER = ['ssc-cgl-mocks', 'ssc-chsl-mocks'];
/* TSSC-NODASHPRO-V1 (2026-10-17) — rank and analysis are free for everyone now, so the
   old Dashboard Pro key is never listed as part of a purchase. */
const FREE_NOW = k => k === 'ssc-cgl-dashboard' || k === 'p-ssc-cgl-dashboard';
const keyRank = k => { const i = KEYORDER.indexOf(k); return i < 0 ? 99 : i; };

/* The access keys THIS order unlocked: what the payment server recorded on the
   order; for older orders that have no record, the course's own key. */
function keysFor(p, mods) {
  const id = p.courseId || p.productId || '';
  let keys = (Array.isArray(p.grantedKeys) && p.grantedKeys.length) ? p.grantedKeys.slice() : [];
  if (!keys.length) {
    if (mods[id]) keys = [id];
    else if (mods[String(id).replace(/^p-/, '')]) keys = [String(id).replace(/^p-/, '')];
    else if (id === 'p-ssc-cgl-chsl-combo') keys = ['ssc-cgl-mocks', 'ssc-chsl-mocks'];
    else if (id === 'p-upgrade-chsl') keys = ['ssc-chsl-mocks'];
    else if (id === 'p-upgrade-cgl')  keys = ['ssc-cgl-mocks'];
  }
  return [...new Set(keys)].filter(k => !FREE_NOW(k)).sort((a, b) => keyRank(a) - keyRank(b));
}

function card(p, ent) {
  const paid   = p.status === 'paid';
  const paidAt = ts(p.paidAt) || ts(p.createdAt);
  const id     = p.courseId || p.productId || '';
  const c      = COURSE[id] || {};
  const name   = (FREE_NOW(id) ? c.name : '') || p.productLabel || c.name || id || 'Course';
  const mods   = (ent && ent.modules) || {};

  let gets;
  if (!paid) {
    gets = '<div class="gets-none">This payment was not completed, so it did not unlock anything.</div>';
  } else {
    const keys = keysFor(p, mods);
    gets = (!keys.length && FREE_NOW(id))
      ? '<ul><li>\u2705 Rank and performance analysis &mdash; <span class="d">now free for everyone</span></li></ul>'
      : keys.length
      ? '<ul>' + keys.map(k => {
          const m = mods[k];
          const t = m ? ts(m.expiresAt) : 0;
          const label = esc(KEYNAME[k] || String(k).replace(/-/g, ' '));
          if (m && m.active === true && t > Date.now())
            return `<li>\u2705 ${label} &mdash; <span class="d">access till ${esc(fmtD(t))}</span></li>`;
          if (t)
            return `<li class="x">\u23F9 ${label} &mdash; <span class="d">expired ${esc(fmtD(t))}</span></li>`;
          return `<li class="x">\u23F9 ${label} &mdash; <span class="d">not active</span></li>`;
        }).join('') + '</ul>'
      : '<div class="gets-none">Access details are not available for this order. Write to us with the Payment ID below.</div>';
  }

  return `
  <div class="order">
    <div class="order-top">
      <div>
        <div class="order-kicker">Course purchased</div>
        <div class="order-course">${esc(name)}${c.chip ? `<span class="exam-chip ${c.cls}">${esc(c.chip)}</span>` : ''}</div>
        <div style="margin-top:.35rem;">
          <span class="pill ${paid ? 'p-paid' : 'p-pending'}">${paid ? 'paid' : 'not completed'}</span>
        </div>
      </div>
      <div class="order-amt">&#8377;${esc(p.amount ?? '')}</div>
    </div>
    <div class="gets">
      <div class="gets-h">${paid ? 'What this purchase gives you' : 'Status'}</div>
      ${gets}
    </div>
    <div class="rows">
      <div><div class="row-l">${paid ? 'Paid on' : 'Tried on'}</div><div class="row-v">${esc(fmtDT(paidAt))}</div></div>
      <div><div class="row-l">Payment ID</div><div class="row-v mono">${esc(p.paymentId || '—')}</div></div>
      <div><div class="row-l">Order ID</div><div class="row-v mono">${esc(p.orderId || '—')}</div></div>
      <div><div class="row-l">Registered mobile</div><div class="row-v mono">${esc(p.mobile || '—')}</div></div>
    </div>
  </div>`;
}

onAuthStateChanged(auth, async user => {
  tsscPaintNav(user);
  if (user) {
    /* Keep the cached profile fresh for the next page's instant paint. */
    try {
      localStorage.setItem('tssc_user', JSON.stringify({
        uid: user.uid,
        name: user.displayName || 'Student',
        phone: user.phoneNumber || '',
        email: user.email || '',
        photoURL: user.photoURL || ''
      }));
    } catch (_) {}
  } else {
    try { localStorage.removeItem('tssc_user'); } catch (_) {}
  }

  if (!user) { signedOut(); return; }

  try {
    /* Rules allow a signed-in user to read payment docs where uid matches. */
    const snap = await getDocs(
      query(collection(db, 'payments'), where('uid', '==', user.uid))
    );

    if (snap.empty) { noOrders(user.email); return; }

    /* One entitlement doc per user, keyed by uid. */
    let ent = null;
    try {
      const e = await getDoc(doc(db, 'entitlements', user.uid));
      if (e.exists()) ent = e.data();
    } catch (_) { /* absent or unreadable — cards still render */ }

    const rows = snap.docs.map(d => d.data())
      .sort((a, b) => (ts(b.paidAt) || ts(b.createdAt)) - (ts(a.paidAt) || ts(a.createdAt)));

    const html = rows.map(p => card(p, ent)).join('');     /* TSSC-ORDERCARD-V2 */

    out.innerHTML = html + `
      <div class="note">
        Keep your <strong>Payment ID</strong> handy if you ever need to contact us about a
        purchase. A receipt was also emailed to you by Razorpay at the time of payment.
        Questions? Write to
        <a href="mailto:contact@trickyssc.com">contact@trickyssc.com</a> &mdash;
        we reply within 24 hours.
      </div>`;

  } catch (err) {
    console.error(err);
    out.innerHTML = `
      <div class="panel">
        <h2>Could not load your orders</h2>
        <p>Something went wrong while fetching your purchases. Please refresh the page.
           If it keeps happening, write to
           <a href="mailto:contact@trickyssc.com" style="color:#FF6B00;font-weight:600;">contact@trickyssc.com</a>.</p>
        <button class="btn ghost" onclick="location.reload()">Try again</button>
      </div>`;
  }
});
</script>

</body>
</html>
