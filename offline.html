<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No internet – TrickySSC</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#FFF8F2;color:#1A202C;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
.b{max-width:320px;}
.i{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#FF6B00,#FF9A3D);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 18px;box-shadow:0 8px 22px rgba(255,107,0,.3);}
h1{font-size:1.35rem;margin-bottom:8px;}
p{color:#64748B;font-size:.95rem;line-height:1.55;}
button,a{display:block;width:100%;height:50px;line-height:50px;border-radius:14px;border:0;font:inherit;font-weight:800;font-size:1rem;margin-top:14px;text-decoration:none;cursor:pointer;}
button{background:linear-gradient(135deg,#FF6B00,#FF8C38);color:#fff;margin-top:22px;}
a{background:#fff;border:1px solid #EDF0F5;color:#1A202C;}
</style>
</head>
<body>
<div class="b">
  <div class="i">📡</div>
  <h1>No internet connection</h1>
  <p>Check your mobile data or Wi-Fi and try again. Your saved scores are safe.</p>
  <p lang="hi" style="margin-top:6px;">इंटरनेट कनेक्शन नहीं है। डेटा या वाई-फ़ाई जाँचकर दोबारा कोशिश करें।</p>
  <button onclick="location.reload()">Try again</button>
  <a href="/app.html">Go to home</a>
</div>
<script>window.addEventListener('online',function(){location.reload();});</script>
</body>
</html>
