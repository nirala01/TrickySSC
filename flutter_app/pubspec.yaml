name: trickyssc
description: TrickySSC - SSC and Railway mock tests (Android app).
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_widget_from_html_core: ^0.15.2
  flutter_math_fork: ^0.7.2
  scrollable_positioned_list: ^0.3.8
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  in_app_purchase: ^3.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/pricing.json
    - catalog.json
