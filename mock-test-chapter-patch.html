<!-- ============================================================
  MOCK-TEST.HTML PATCH for Chapter Tests
  Add this block at the TOP of your existing init logic in mock-test.html
  (inside the DOMContentLoaded or firebase onAuthStateChanged callback)
  ============================================================ -->

<script>
// ===== CHAPTER TEST MODE DETECTION =====
// Add this BEFORE your regular mock test loading logic

const urlParams = new URLSearchParams(window.location.search);
const isChapterMode = urlParams.get('mode') === 'chapter';

if (isChapterMode) {
  const chData = JSON.parse(sessionStorage.getItem('chapterTestData') || 'null');

  if (!chData || !chData.questions?.length) {
    alert('Test data not found. Returning to chapters.');
    history.back();
  } else {
    // Override your normal question loading
    // Load actual question documents from Firestore by IDs
    loadChapterTestQuestions(chData);
  }
}

async function loadChapterTestQuestions(chData) {
  // Show loading state (use your existing loading UI)
  showLoading?.();

  // Update page title / header to show chapter info
  document.title = `${chData.chapter} – Test ${chData.testNum} | TrickySSC`;

  // If you have a header element for test name:
  const testTitleEl = document.getElementById('testTitle') || document.getElementById('mockTitle');
  if (testTitleEl) testTitleEl.textContent = `${chData.chapter} – Test ${chData.testNum}`;

  // Fetch questions from Firestore by their IDs
  const questionDocs = [];
  for (const qId of chData.questions) {
    try {
      const snap = await getDoc(doc(db, 'questions', qId));
      if (snap.exists()) questionDocs.push({ id: snap.id, ...snap.data() });
    } catch(e) { console.warn('Failed to load', qId); }
  }

  if (!questionDocs.length) {
    alert('Could not load questions. Please try again.');
    history.back();
    return;
  }

  // ===== USE YOUR EXISTING TEST ENGINE =====
  // Pass the loaded questions to your existing mock test renderer
  // The key is to map them to the same format your mock test expects

  // Set timer (20 min = 1200 seconds)
  const TIME_LIMIT = chData.timeLimit * 60; // seconds
  startTimer?.(TIME_LIMIT); // call your existing timer function

  // Render questions using your existing function
  // This depends on your mock-test.html structure, but typically:
  renderQuestions?.(questionDocs);
  // OR
  window._questions = questionDocs;
  window._timeLimit = TIME_LIMIT;
  initMockTest?.(questionDocs, TIME_LIMIT);

  // ===== ON TEST SUBMIT =====
  // Hook into your existing submit/end flow to save score back
  window._onTestComplete = function(results) {
    // results = { score, total, correct, wrong, unattempted }
    const pct = Math.round((results.score / (results.total * 2)) * 100);

    // Save to localStorage history
    const history = JSON.parse(localStorage.getItem(chData.historyKey) || '{}');
    history[chData.testNum] = {
      score: results.score,
      pct: Math.max(0, pct),
      correct: results.correct,
      wrong: results.wrong,
      date: new Date().toISOString()
    };
    localStorage.setItem(chData.historyKey, JSON.stringify(history));

    // Clear sessionStorage
    sessionStorage.removeItem('chapterTestData');
  };
}
</script>
